<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi Đấu Từ Vựng 1-1 - Vui Học Tiếng Hàn</title>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; min-height: 100vh; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #7c3aed 100%); color: #0f172a; }
        .du-page { max-width: 760px; margin: 22px auto 70px; padding: 0 16px; }
        .du-hero { text-align: center; color: #fff; margin-bottom: 18px; }
        .du-hero h1 { font-size: 2.1em; font-weight: 900; margin: 0 0 4px; }
        .du-hero p { margin: 0; color: #c7d2fe; }
        .du-card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 12px 34px rgba(0,0,0,0.25); margin-bottom: 14px; }
        .du-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .du-opt { border: 2px solid #e2e8f0; border-radius: 16px; padding: 16px 12px; text-align: center; cursor: pointer; background: #fff; font-family: inherit; transition: 0.15s; }
        .du-opt:hover { border-color: #8b5cf6; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(139,92,246,0.18); }
        .du-opt .ic { font-size: 2em; } .du-opt b { display: block; font-size: 1.02em; margin: 4px 0 2px; color: #1e1b4b; } .du-opt span { font-size: 0.8em; color: #64748b; }
        .du-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .du-input { flex: 1 1 160px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 11px 14px; font-size: 1.05em; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; font-family: inherit; }
        .du-btn { border: none; border-radius: 12px; padding: 11px 20px; font-weight: 800; font-size: 0.98em; cursor: pointer; background: #7c3aed; color: #fff; font-family: inherit; }
        .du-btn.ghost { background: #f1f5f9; color: #334155; }
        .du-btn:disabled { opacity: 0.6; cursor: default; }
        .du-label { font-size: 0.85em; color: #64748b; font-weight: 700; margin-bottom: 6px; }
        select.du-input { letter-spacing: 0; text-transform: none; font-weight: 700; }
        .du-code { font-size: 2.6em; font-weight: 900; letter-spacing: 8px; color: #7c3aed; text-align: center; margin: 6px 0; }
        .du-wait { text-align: center; }
        .du-spinner { width: 46px; height: 46px; border: 5px solid #ede9fe; border-top-color: #7c3aed; border-radius: 50%; animation: duSpin 1s linear infinite; margin: 10px auto; }
        @keyframes duSpin { to { transform: rotate(360deg); } }
        .du-friends { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 220px; overflow-y: auto; }
        .du-friend { display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; }
        /* Trận đấu */
        .du-vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; color: #fff; margin-bottom: 12px; }
        .du-player { background: rgba(255,255,255,0.12); border-radius: 14px; padding: 10px 12px; }
        .du-player.me { border: 2px solid #a78bfa; } .du-player.op { text-align: right; }
        .du-pname { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .du-pscore { font-size: 1.6em; font-weight: 900; }
        .du-pbar { height: 6px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .du-pbar div { height: 100%; background: #facc15; transition: width 0.3s; }
        .du-vs-mid { font-size: 1.4em; font-weight: 900; color: #facc15; }
        .du-q { text-align: center; }
        .du-qnum { color: #64748b; font-weight: 700; font-size: 0.9em; }
        .du-word { font-size: 2.6em; font-weight: 900; color: #1e1b4b; margin: 6px 0 12px; word-break: keep-all; }
        .du-timer { height: 8px; background: #ede9fe; border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
        .du-timer div { height: 100%; background: linear-gradient(90deg, #22c55e, #facc15, #ef4444); width: 100%; }
        .du-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .du-ans { border: 2px solid #e2e8f0; background: #fff; border-radius: 14px; padding: 14px 10px; font-size: 1em; font-weight: 700; cursor: pointer; font-family: inherit; color: #1e293b; min-height: 64px; transition: 0.12s; }
        .du-ans:hover:not(:disabled) { border-color: #8b5cf6; background: #f5f3ff; }
        .du-ans.ok { border-color: #22c55e; background: #dcfce7; color: #166534; }
        .du-ans.bad { border-color: #ef4444; background: #fee2e2; color: #991b1b; }
        .du-ans:disabled { cursor: default; }
        .du-fb { min-height: 26px; margin-top: 10px; font-weight: 900; text-align: center; }
        .du-count { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(30,27,75,0.75); color: #fff; font-size: 7em; font-weight: 900; z-index: 9999; }
        /* Kết quả */
        .du-result-title { text-align: center; font-size: 2em; font-weight: 900; margin: 4px 0; }
        .du-result-sub { text-align: center; color: #64748b; margin-bottom: 14px; }
        .du-score-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .du-score-box { border-radius: 14px; padding: 12px; text-align: center; background: #f8fafc; border: 2px solid #e2e8f0; }
        .du-score-box.win { border-color: #facc15; background: #fefce8; }
        .du-score-box b { display: block; font-size: 2em; font-weight: 900; color: #1e1b4b; }
        .du-review { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
        .du-review-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.92em; }
        .du-review-row:last-child { border-bottom: none; }
        .du-hide { display: none !important; }
        @media (max-width: 640px) {
            .du-grid { grid-template-columns: 1fr; }
            .du-opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; }
            .du-opt .ic { font-size: 1.6em; } .du-opt b { margin: 0; }
            .du-word { font-size: 2em; }
            .du-answers { grid-template-columns: 1fr; }
            .du-pscore { font-size: 1.25em; }
            .du-hero h1 { font-size: 1.6em; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="assets/js/theme-picker.js"></script>
    <script src="assets/js/navbar.js"></script>
</head>
<body>
<div class="du-page">
    <div class="du-hero">
        <h1>⚔️ Thi Đấu Từ Vựng 1-1</h1>
        <p>10 câu · 10 giây mỗi câu · trả lời đúng và nhanh để thắng!</p>
    </div>

    <div id="duLogin" class="du-card du-hide" style="text-align:center;">🔒 Vui lòng đăng nhập để thi đấu.</div>

    <!-- SẢNH -->
    <div id="duLobby" class="du-hide">
        <div class="du-card">
            <div class="du-grid">
                <button class="du-opt" onclick="Duel.quickMatch()"><div class="ic">⚡</div><div><b>Ghép ngẫu nhiên</b><span>Đấu với người đang chờ</span></div></button>
                <button class="du-opt" onclick="Duel.createRoom(false)"><div class="ic">🏠</div><div><b>Tạo phòng riêng</b><span>Gửi mã cho bạn bè</span></div></button>
                <button class="du-opt" onclick="document.getElementById('duCodeInput').focus()"><div class="ic">🔑</div><div><b>Vào bằng mã</b><span>Nhập mã phòng bên dưới</span></div></button>
            </div>
        </div>
        <div class="du-card">
            <div class="du-label">Vào phòng bằng mã</div>
            <div class="du-row">
                <input id="duCodeInput" class="du-input" maxlength="6" placeholder="VD: K7P2QX">
                <button class="du-btn" onclick="Duel.joinByCode()">Vào phòng</button>
            </div>
            <div class="du-label" style="margin-top:14px;">Bộ từ vựng (khi bạn tạo phòng)</div>
            <select id="duSource" class="du-input">
                <option value="topik">📘 TOPIK II — 300 từ thông dụng</option>
                <option value="mine">📓 Sổ từ vựng của tôi</option>
            </select>
            <div id="duStats" style="margin-top:12px;font-size:0.88em;color:#64748b;"></div>
        </div>
    </div>

    <!-- CHỜ ĐỐI THỦ -->
    <div id="duWaiting" class="du-card du-wait du-hide">
        <div id="duWaitTitle" style="font-weight:900;font-size:1.15em;">Đang chờ đối thủ...</div>
        <div class="du-spinner"></div>
        <div id="duRoomBox">
            <div class="du-label">Mã phòng</div>
            <div class="du-code" id="duRoomCode"></div>
            <div class="du-row" style="justify-content:center;">
                <button class="du-btn ghost" onclick="Duel.copyLink()">🔗 Sao chép link mời</button>
            </div>
            <div id="duFriendsBox" style="text-align:left;margin-top:14px;"></div>
        </div>
        <button class="du-btn ghost" style="margin-top:14px;" onclick="Duel.cancelRoom()">Huỷ</button>
    </div>

    <!-- TRẬN ĐẤU -->
    <div id="duGame" class="du-hide">
        <div class="du-vs">
            <div class="du-player me"><div class="du-pname" id="duMeName">Bạn</div><div class="du-pscore" id="duMeScore">0</div><div class="du-pbar"><div id="duMeBar" style="width:0%"></div></div></div>
            <div class="du-vs-mid">VS</div>
            <div class="du-player op"><div class="du-pname" id="duOpName">Đối thủ</div><div class="du-pscore" id="duOpScore">0</div><div class="du-pbar"><div id="duOpBar" style="width:0%"></div></div></div>
        </div>
        <div class="du-card du-q">
            <div class="du-qnum" id="duQNum">Câu 1/10</div>
            <div class="du-word" id="duWord"></div>
            <div class="du-timer"><div id="duTimer"></div></div>
            <div class="du-answers" id="duAnswers"></div>
            <div class="du-fb" id="duFb"></div>
        </div>
    </div>

    <!-- KẾT QUẢ -->
    <div id="duResult" class="du-card du-hide"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script src="assets/js/vocab-daily.js"></script>
<script>
(function () {
    'use strict';
    const N_Q = 10, Q_MS = 10000, OPEN_ROOM_MAX_AGE = 3 * 60 * 1000;
    const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let me = null, myName = 'Bạn', room = null, roomRef = null, unsub = null;
    let qIdx = 0, myAnswers = [], myScore = 0, qTimer = null, qStart = 0, playing = false, finishedShown = false, waitOpTimer = null;

    const $ = id => document.getElementById(id);
    const db = () => firebase.firestore();
    const FV = () => firebase.firestore.FieldValue;
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function show(id) { ['duLogin', 'duLobby', 'duWaiting', 'duGame', 'duResult'].forEach(x => $(x).classList.toggle('du-hide', x !== id)); }
    function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function newCode() { let s = ''; for (let i = 0; i < 6; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
    function myKey() { return 's_' + me.uid; }
    function opId() { return room && (room.hostId === me.uid ? room.guestId : room.hostId); }
    function opName() { return room ? (room.hostId === me.uid ? room.guestName : room.hostName) || 'Đối thủ' : 'Đối thủ'; }

    // ── Bộ câu hỏi: từ tiếng Hàn → chọn nghĩa đúng trong 4 đáp án ──
    async function buildQuestions() {
        let pool = (window.VOCAB_DATA || []).map(w => ({ w: w.word, m: w.meaning }));
        if ($('duSource').value === 'mine') {
            const snap = await db().collection('users').doc(me.uid).collection('vocabulary').get();
            const mine = [];
            snap.forEach(d => { const v = d.data(); if (v.word && v.meaning && v.word !== '__folder_marker__') mine.push({ w: v.word, m: v.meaning }); });
            const uniq = Array.from(new Map(mine.map(x => [x.w, x])).values());
            if (uniq.length < 8) {
                await Swal.fire('Chưa đủ từ', 'Sổ từ vựng của bạn cần ít nhất 8 từ có nghĩa. Tạm dùng bộ TOPIK II nhé!', 'info');
            } else pool = uniq;
        }
        const picked = shuffle(pool).slice(0, N_Q);
        return picked.map(item => {
            const others = shuffle(pool.filter(x => x.m !== item.m)).slice(0, 3).map(x => x.m);
            const opts = shuffle([item.m, ...others]);
            return { w: String(item.w).slice(0, 60), o: opts.map(o => String(o).slice(0, 120)), a: opts.indexOf(item.m) };
        });
    }

    // ── Tạo phòng ──
    async function createRoom(open) {
        try {
            const questions = await buildQuestions();
            for (let tries = 0; tries < 5; tries++) {
                const code = newCode();
                const ref = db().collection('duels').doc(code);
                const exists = await ref.get();
                if (exists.exists) continue;
                await ref.set({
                    hostId: me.uid, hostName: myName.slice(0, 60), guestId: null, guestName: '',
                    status: 'waiting', open: !!open, questions, createdAt: FV().serverTimestamp(),
                    [myKey()]: { answers: [], score: 0, done: false }
                });
                enterRoom(code);
                return;
            }
            Swal.fire('Lỗi', 'Không tạo được phòng, thử lại nhé.', 'error');
        } catch (e) { Swal.fire('Lỗi', e.message, 'error'); }
    }

    // ── Vào phòng (transaction: chống 2 người cùng vào 1 chỗ) ──
    async function joinRoom(code, silent) {
        code = String(code || '').trim().toUpperCase();
        if (!/^[A-Z0-9]{6}$/.test(code)) { if (!silent) Swal.fire('Mã không hợp lệ', 'Mã phòng gồm 6 ký tự.', 'warning'); return false; }
        const ref = db().collection('duels').doc(code);
        try {
            const result = await db().runTransaction(async tx => {
                const d = await tx.get(ref);
                if (!d.exists) return 'missing';
                const r = d.data();
                if (r.hostId === me.uid || r.guestId === me.uid) return 'mine';
                if (r.status !== 'waiting' || r.guestId) return 'full';
                tx.update(ref, {
                    guestId: me.uid, guestName: myName.slice(0, 60), status: 'playing', startAt: FV().serverTimestamp(),
                    [myKey()]: { answers: [], score: 0, done: false }
                });
                return 'ok';
            });
            if (result === 'ok' || result === 'mine') { enterRoom(code); return true; }
            if (!silent) Swal.fire(result === 'missing' ? 'Không tìm thấy phòng' : 'Phòng đã đủ người',
                result === 'missing' ? 'Kiểm tra lại mã phòng nhé.' : 'Trận đấu này đã bắt đầu.', 'info');
            return false;
        } catch (e) { if (!silent) Swal.fire('Lỗi', e.message, 'error'); return false; }
    }

    // ── Ghép ngẫu nhiên: vào phòng mở đang chờ, nếu không có thì tạo phòng mở ──
    async function quickMatch() {
        try {
            const snap = await db().collection('duels').where('status', '==', 'waiting').limit(20).get();
            const now = Date.now();
            const cands = snap.docs.filter(d => {
                const r = d.data();
                const t = r.createdAt && r.createdAt.toMillis ? r.createdAt.toMillis() : 0;
                return r.open && r.hostId !== me.uid && !r.guestId && now - t < OPEN_ROOM_MAX_AGE;
            });
            for (const d of shuffle(cands)) { if (await joinRoom(d.id, true)) return; }
            await createRoom(true);
        } catch (e) { Swal.fire('Lỗi', e.message, 'error'); }
    }

    // ── Theo dõi phòng ──
    function enterRoom(code) {
        if (unsub) unsub();
        roomRef = db().collection('duels').doc(code);
        history.replaceState(null, '', 'duel.html?room=' + code);
        qIdx = 0; myAnswers = []; myScore = 0; playing = false; finishedShown = false;
        unsub = roomRef.onSnapshot(d => {
            if (!d.exists) { leaveToLobby('Phòng đã bị huỷ.'); return; }
            room = d.data(); room.id = d.id;
            onRoomUpdate();
        }, e => Swal.fire('Lỗi', e.message, 'error'));
    }

    function onRoomUpdate() {
        if (room.status === 'cancelled') { leaveToLobby(room.hostId === me.uid ? null : 'Chủ phòng đã huỷ trận.'); return; }
        if (room.status === 'waiting') {
            show('duWaiting');
            $('duRoomCode').textContent = room.id;
            $('duWaitTitle').textContent = room.open ? '⚡ Đang tìm đối thủ ngẫu nhiên...' : 'Đang chờ bạn bè vào phòng...';
            $('duRoomBox').style.display = room.open ? 'none' : 'block';
            if (!room.open) loadFriends();
            return;
        }
        // Cập nhật bảng điểm 2 bên
        const mine = room[myKey()] || {}, op = room['s_' + opId()] || {};
        $('duMeName').textContent = myName;
        $('duOpName').textContent = opName();
        $('duOpScore').textContent = op.score || 0;
        $('duOpBar').style.width = Math.round(((op.answers || []).length / N_Q) * 100) + '%';

        if ((room.status === 'playing') && !playing && !mine.done) startGame();
        if (mine.done && !finishedShown) maybeShowResult();
    }

    // ── Chơi ──
    function startGame() {
        playing = true;
        // Tải lại trang giữa trận → làm tiếp từ câu đang dở
        const saved = room[myKey()] || {};
        myAnswers = Array.isArray(saved.answers) ? saved.answers.slice() : [];
        myScore = saved.score || 0;
        qIdx = Math.min(myAnswers.length, room.questions.length - 1);
        $('duMeScore').textContent = myScore;
        $('duMeBar').style.width = Math.round(myAnswers.length / room.questions.length * 100) + '%';
        show('duGame');
        const ov = document.createElement('div');
        ov.className = 'du-count';
        document.body.appendChild(ov);
        let n = 3;
        const tick = () => {
            if (n === 0) { ov.remove(); showQuestion(); return; }
            ov.textContent = n--;
            setTimeout(tick, 800);
        };
        tick();
    }

    function showQuestion() {
        const q = room.questions[qIdx];
        $('duQNum').textContent = 'Câu ' + (qIdx + 1) + '/' + room.questions.length;
        $('duWord').textContent = q.w;
        $('duFb').textContent = '';
        $('duAnswers').innerHTML = q.o.map((o, i) => `<button class="du-ans" data-i="${i}">${esc(o)}</button>`).join('');
        $('duAnswers').querySelectorAll('.du-ans').forEach(b => b.onclick = () => answer(parseInt(b.dataset.i, 10)));
        const bar = $('duTimer');
        bar.style.transition = 'none'; bar.style.width = '100%';
        void bar.offsetWidth;
        bar.style.transition = 'width ' + (Q_MS / 1000) + 's linear'; bar.style.width = '0%';
        qStart = Date.now();
        clearTimeout(qTimer);
        qTimer = setTimeout(() => answer(-1), Q_MS);
    }

    function answer(choice) {
        clearTimeout(qTimer);
        const q = room.questions[qIdx];
        const t = Math.min(Q_MS, Date.now() - qStart);
        const ok = choice === q.a;
        const pts = ok ? 100 + Math.round(50 * (1 - t / Q_MS)) : 0;
        myScore += pts;
        myAnswers.push({ c: choice, ok, t });
        $('duAnswers').querySelectorAll('.du-ans').forEach(b => {
            b.disabled = true;
            const i = parseInt(b.dataset.i, 10);
            if (i === q.a) b.classList.add('ok'); else if (i === choice) b.classList.add('bad');
        });
        $('duFb').innerHTML = ok ? `<span style="color:#16a34a;">✅ +${pts} điểm</span>` : `<span style="color:#dc2626;">${choice < 0 ? '⏰ Hết giờ!' : '❌ Sai rồi!'}</span>`;
        $('duMeScore').textContent = myScore;
        $('duMeBar').style.width = Math.round(myAnswers.length / room.questions.length * 100) + '%';
        const done = myAnswers.length >= room.questions.length;
        roomRef.update({ [myKey()]: { answers: myAnswers, score: myScore, done } }).catch(e => console.warn(e));
        setTimeout(() => {
            if (done) { maybeShowResult(); return; }
            qIdx++; showQuestion();
        }, 900);
    }

    // ── Kết quả ──
    function maybeShowResult() {
        const op = room['s_' + opId()] || {};
        if (!op.done) {
            show('duResult');
            $('duResult').innerHTML = `<div class="du-wait"><div style="font-weight:900;font-size:1.2em;">Bạn đã xong! Điểm: ${myScore}</div>
                <div class="du-spinner"></div><div style="color:#64748b;">Đang chờ ${esc(opName())} hoàn thành...</div></div>`;
            // Đối thủ thoát giữa chừng → sau 60 giây vẫn hiện kết quả
            if (!waitOpTimer) waitOpTimer = setTimeout(() => { waitOpTimer = null; renderResult(true); }, 60000);
            return;
        }
        renderResult(false);
    }

    function renderResult(opLeft) {
        if (finishedShown) return;
        finishedShown = true;
        clearTimeout(waitOpTimer); waitOpTimer = null;
        const op = room['s_' + opId()] || {};
        const opScore = op.score || 0;
        const outcome = myScore > opScore ? 'win' : myScore < opScore ? 'lose' : 'draw';
        if (room.status !== 'finished') roomRef.update({ status: 'finished', endedAt: FV().serverTimestamp() }).catch(() => {});
        const title = outcome === 'win' ? '🏆 Bạn thắng!' : outcome === 'lose' ? '😤 Thua mất rồi!' : '🤝 Hoà!';
        const myCorrect = myAnswers.filter(a => a.ok).length;
        const opCorrect = (op.answers || []).filter(a => a.ok).length;
        show('duResult');
        $('duResult').innerHTML = `
            <div class="du-result-title" style="color:${outcome === 'win' ? '#ca8a04' : outcome === 'lose' ? '#dc2626' : '#7c3aed'};">${title}</div>
            <div class="du-result-sub">${opLeft ? esc(opName()) + ' chưa hoàn thành trận đấu.' : 'Trận đấu kết thúc!'}</div>
            <div class="du-score-row">
                <div class="du-score-box ${outcome === 'win' ? 'win' : ''}"><div style="font-weight:800;">${esc(myName)}</div><b>${myScore}</b><span style="color:#64748b;">${myCorrect}/${room.questions.length} câu đúng</span></div>
                <div class="du-score-box ${outcome === 'lose' ? 'win' : ''}"><div style="font-weight:800;">${esc(opName())}</div><b>${opScore}</b><span style="color:#64748b;">${opCorrect}/${room.questions.length} câu đúng</span></div>
            </div>
            <div id="duReward" style="text-align:center;font-weight:800;color:#7c3aed;margin-bottom:12px;"></div>
            <div class="du-review">${room.questions.map((q, i) => {
                const a = myAnswers[i] || {};
                return `<div class="du-review-row"><span><b>${esc(q.w)}</b> — ${esc(q.o[q.a])}</span><span>${a.ok ? '✅' : '❌'}</span></div>`;
            }).join('')}</div>
            <div class="du-row" style="justify-content:center;">
                <button class="du-btn" onclick="Duel.rematch()">⚔️ Thách đấu lại</button>
                <button class="du-btn ghost" onclick="Duel.toLobby()">Về sảnh</button>
            </div>`;
        if (outcome === 'win' && typeof confetti === 'function') confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
        giveReward(outcome);
    }

    // EXP: thắng +15 · hoà +8 · thua +3 (mỗi trận chỉ nhận 1 lần)
    function giveReward(outcome) {
        const key = 'duel_reward_' + room.id + '_' + me.uid;
        try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) {}
        const exp = outcome === 'win' ? 15 : outcome === 'draw' ? 8 : 3;
        const ref = db().collection('users').doc(me.uid);
        const data = {
            bonusEXP: FV().increment(exp), bonusEXPAt: FV().serverTimestamp(),
            duelPlayed: FV().increment(1), duelWins: FV().increment(outcome === 'win' ? 1 : 0)
        };
        const done = () => {
            const el = $('duReward'); if (el) el.textContent = '⭐ +' + exp + ' EXP';
            if (window.Badges && typeof window.Badges.check === 'function') window.Badges.check();
        };
        ref.set(data, { merge: true }).then(done).catch(() => {
            // Rules giới hạn 1 lần cộng EXP / 20 giây → thử lại sau 25 giây
            setTimeout(() => { data.bonusEXPAt = FV().serverTimestamp(); ref.set(data, { merge: true }).then(done).catch(e => console.warn('[Duel] EXP', e)); }, 25000);
        });
    }

    // ── Mời bạn bè (thông báo kèm link vào phòng) ──
    let friendsLoaded = false;
    async function loadFriends() {
        if (friendsLoaded) return;
        friendsLoaded = true;
        const box = $('duFriendsBox');
        try {
            const snap = await db().collection('friendships').where('users', 'array-contains', me.uid).get();
            const list = [];
            snap.forEach(d => {
                const f = d.data();
                const pid = (f.users || []).find(u => u !== me.uid);
                if (pid) list.push({ uid: pid, name: (f.userNames && f.userNames[pid]) || 'Bạn bè' });
            });
            if (!list.length) { box.innerHTML = '<div style="color:#94a3b8;font-size:0.88em;text-align:center;">Chưa có bạn bè — hãy gửi link mời ở trên nhé.</div>'; return; }
            box.innerHTML = '<div class="du-label">Mời bạn bè</div><div class="du-friends">' + list.map(f =>
                `<div class="du-friend"><span style="font-weight:700;">${esc(f.name)}</span><button class="du-btn ghost" style="padding:6px 12px;" data-uid="${esc(f.uid)}">⚔️ Mời</button></div>`).join('') + '</div>';
            box.querySelectorAll('button[data-uid]').forEach(b => b.onclick = () => invite(b.dataset.uid, b));
        } catch (e) { box.innerHTML = ''; }
    }

    async function invite(uid, btn) {
        btn.disabled = true;
        try {
            await db().collection('notifications').add({
                userId: uid, type: 'duel', fromUserId: me.uid, fromUserName: myName.slice(0, 60),
                message: 'mời bạn thi đấu từ vựng 1-1! Mã phòng: ' + room.id,
                link: 'duel.html?room=' + room.id, read: false, createdAt: FV().serverTimestamp()
            });
            btn.textContent = '✓ Đã mời';
        } catch (e) { btn.disabled = false; Swal.fire('Lỗi', e.message, 'error'); }
    }

    function copyLink() {
        const url = location.origin + location.pathname + '?room=' + room.id;
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(() =>
            Swal.fire({ icon: 'success', title: 'Đã sao chép link mời', text: url, timer: 1800, showConfirmButton: false }));
        else Swal.fire('Link mời', url, 'info');
    }

    async function cancelRoom() {
        if (room && room.hostId === me.uid && room.status === 'waiting') {
            await roomRef.update({ status: 'cancelled' }).catch(() => {});
        }
        leaveToLobby();
    }

    async function rematch() {
        const opUid = opId();
        await createRoom(false);
        if (opUid) {
            // Tự gửi lời mời cho đối thủ cũ
            let tries = 0;
            const t = setInterval(() => {
                tries++;
                if (room && room.status === 'waiting') {
                    clearInterval(t);
                    db().collection('notifications').add({
                        userId: opUid, type: 'duel', fromUserId: me.uid, fromUserName: myName.slice(0, 60),
                        message: 'muốn thách đấu lại! Mã phòng: ' + room.id, link: 'duel.html?room=' + room.id,
                        read: false, createdAt: FV().serverTimestamp()
                    }).catch(() => {});
                } else if (tries > 20) clearInterval(t);
            }, 250);
        }
    }

    function leaveToLobby(msg) {
        if (unsub) { unsub(); unsub = null; }
        clearTimeout(qTimer); clearTimeout(waitOpTimer); waitOpTimer = null;
        room = null; roomRef = null; playing = false; friendsLoaded = false;
        history.replaceState(null, '', 'duel.html');
        show('duLobby');
        loadStats();
        if (msg) Swal.fire('Thông báo', msg, 'info');
    }

    async function loadStats() {
        try {
            const u = await db().collection('users').doc(me.uid).get();
            const d = u.exists ? u.data() : {};
            const played = d.duelPlayed || 0, wins = d.duelWins || 0;
            $('duStats').innerHTML = played ? `🏅 Thành tích: <b>${wins}</b> thắng / <b>${played}</b> trận (${Math.round(wins / played * 100)}%)` : 'Chưa có trận nào — thử ngay nhé!';
        } catch (e) {}
    }

    firebase.auth().onAuthStateChanged(user => {
        if (!user) { show('duLogin'); return; }
        me = user;
        myName = user.displayName || (user.email ? user.email.split('@')[0] : 'Bạn');
        const code = new URLSearchParams(location.search).get('room');
        show('duLobby');
        loadStats();
        if (code) joinRoom(code);
    });
    $('duCodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinByCode(); });
    function joinByCode() { joinRoom($('duCodeInput').value); }

    window.Duel = { quickMatch, createRoom, joinByCode, copyLink, cancelRoom, rematch, toLobby: () => leaveToLobby() };
})();
</script>
<script src="assets/js/badges.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/menu.js"></script>
</body>
