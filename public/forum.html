<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diễn đàn - Vui Học Tiếng Hàn</title>
    <link rel="icon" type="image/png" sizes="16x16"  href="/public/assets/img/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/forum.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/vi.min.js"></script>
    
    <script src="assets/js/theme-picker.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/block.js"></script>
    
    <style>
        body {
            font-family: 'Pretendard', 'Inter', sans-serif;
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0 0 40px 0;
            color: #1f2937;
        }

        .forum-wrapper {
            max-width: 1000px;
            margin: 30px auto 0;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        .forum-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .forum-header h1 {
            font-size: 2.2em;
            font-weight: 800;
            color: #2563eb;
            margin: 0 0 10px 0;
        }

        .forum-header p {
            color: #4b5563;
            margin: 0;
            font-size: 1.1em;
        }

        .forum-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .forum-tab-btn {
            background: #fff;
            border: 2px solid #e5e7eb;
            color: #6b7280;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }

        .forum-tab-btn:hover {
            border-color: #9ca3af;
            color: #1f2937;
        }

        .forum-tab-btn.active {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .forum-content {
            display: none;
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #e5e7eb;
            flex: 1;
            animation: fadeIn 0.3s ease;
        }

        .forum-content.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .forum-wrapper {
                margin-top: 10px;
                padding: 15px 10px;
                border-radius: 16px;
            }
            .forum-tabs {
                gap: 10px;
            }
            .forum-tab-btn {
                padding: 10px 15px;
                font-size: 0.95em;
            }
            .forum-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="forum-wrapper">
        <div class="forum-header">
            <h1>Diễn Đàn</h1>
            <p>Nơi giao lưu, học hỏi và kết bạn</p>
        </div>

        <div class="forum-tabs">
            <button class="forum-tab-btn active" data-tab="tab-global">💬 Chat Công Khai</button>
            <button class="forum-tab-btn" data-tab="tab-qa">📝 Hỏi Đáp & Thảo Luận</button>
            <button class="forum-tab-btn" data-tab="tab-friends">👥 Bạn Bè & Nhắn Tin</button>
        </div>

        <!-- TAB: Chat Công Khai -->
        <div id="tab-global" class="forum-content active">
            <div class="chat-container">
                <div class="chat-messages" id="globalChatMessages">
                    <!-- Messages will be injected here -->
                    <div style="text-align: center; color: #9ca3af; margin-top: 20px;">Đang tải tin nhắn...</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="globalChatInput" placeholder="Nhập tin nhắn..." maxlength="500">
                    <button id="globalChatSendBtn">Gửi</button>
                </div>
            </div>
        </div>

        <!-- TAB: Hỏi Đáp -->
        <div id="tab-qa" class="forum-content">
            <div class="qa-header">
                <div class="qa-search">
                    <input type="text" id="qaSearchInput" placeholder="Tìm kiếm bài viết...">
                </div>
                <button class="btn-primary" id="createNewPostBtn">📝 Viết Bài Mới</button>
            </div>
            <div class="qa-list" id="qaPostList">
                <div style="text-align: center; color: #9ca3af; margin-top: 20px;">Đang tải bài viết...</div>
            </div>
        </div>

        <!-- TAB: Bạn Bè & Nhắn Tin -->
        <div id="tab-friends" class="forum-content">
            <div class="friends-layout">
                <div class="friends-sidebar">
                    <div class="friends-actions">
                        <button class="btn-outline" id="addFriendBtn">➕ Thêm bạn</button>
                        <button class="btn-outline" id="friendRequestsBtn">🔔 Lời mời <span id="reqBadge" class="badge" style="display:none">0</span></button>
                    </div>
                    <h3 class="sidebar-title">Danh sách bạn bè</h3>
                    <div class="friends-list" id="friendsList">
                        <div style="text-align: center; color: #9ca3af; margin-top: 20px; font-size: 0.9em;">Chưa có bạn bè</div>
                    </div>
                </div>
                <div class="friends-main" id="dmArea" style="display: none;">
                    <div class="dm-header">
                        <h3 id="dmChatName">Tên người bạn</h3>
                        <button class="btn-icon" id="closeDmBtn">❌</button>
                    </div>
                    <div class="dm-messages" id="dmMessages">
                        <!-- DM messages -->
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="dmInput" placeholder="Nhập tin nhắn riêng..." maxlength="500">
                        <button id="dmSendBtn">Gửi</button>
                    </div>
                </div>
                <div class="friends-main placeholder-view" id="dmPlaceholder">
                    <div style="text-align: center; color: #9ca3af;">
                        <span style="font-size: 3em;">👋</span><br>
                        Chọn một người bạn để bắt đầu trò chuyện
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="auth.js"></script>
    <script src="assets/js/forum.js"></script>
    
    <script>
        // Tab switching logic
        document.querySelectorAll('.forum-tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.forum-tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.forum-content').forEach(c => c.classList.remove('active'));
                
                e.currentTarget.classList.add('active');
                const targetId = e.currentTarget.getAttribute('data-tab');
                document.getElementById(targetId).classList.add('active');
                
                // Trigger events based on tab selected (if needed in forum.js)
                if (window.forumApp && typeof window.forumApp.onTabChanged === 'function') {
                    window.forumApp.onTabChanged(targetId);
                }
            });
        });
    </script>
</body>
</html>
