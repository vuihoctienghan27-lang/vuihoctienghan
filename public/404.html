<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Không tìm thấy trang - Vui Học Tiếng Hàn</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <meta name="theme-color" content="#8ec5fc">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        :root {
            --navy: #142657;
            --brand-red: #f95052;
            --text-sub: #475569;
            --card-bg: rgba(255, 255, 255, .6);
            --card-border: rgba(255, 255, 255, .8);
            --bg: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            background-attachment: fixed;
            font-family: "Pretendard", "Inter", -apple-system, "Segoe UI", sans-serif;
            color: var(--navy);
        }
        .card {
            width: 100%;
            max-width: 440px;
            padding: 36px 28px 32px;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(20, 38, 87, .12);
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            margin-bottom: 28px;
        }
        .logo img { height: 34px; width: auto; }
        .logo .vh { color: var(--navy); }
        .logo .th { color: var(--brand-red); }
        .code {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--navy), var(--brand-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .ko {
            margin: 8px 0 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-sub);
        }
        h1 {
            margin: 20px 0 8px;
            font-size: 1.35rem;
            font-weight: 800;
        }
        p {
            margin: 0 0 28px;
            font-size: .95rem;
            line-height: 1.6;
            color: var(--text-sub);
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 20px;
            border-radius: 12px;
            font: inherit;
            font-weight: 700;
            font-size: .95rem;
            text-decoration: none;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s, background .15s;
        }
        .btn-primary {
            background: var(--navy);
            color: #fff;
            border: 1px solid var(--navy);
            box-shadow: 0 4px 14px rgba(20, 38, 87, .25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(20, 38, 87, .3); }
        .btn-ghost {
            background: rgba(255, 255, 255, .7);
            color: var(--navy);
            border: 1px solid rgba(20, 38, 87, .15);
        }
        .btn-ghost:hover { background: #fff; }
        a:focus-visible, button:focus-visible {
            outline: 3px solid var(--brand-red);
            outline-offset: 3px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --navy: #e2e8f0;
                --text-sub: #94a3b8;
                --card-bg: rgba(15, 23, 42, .7);
                --card-border: rgba(255, 255, 255, .12);
                --bg: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            }
            .logo .vh { color: #60a5fa; }
            .btn-primary { background: #2563eb; border-color: #2563eb; }
            .btn-ghost { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .15); }
            .btn-ghost:hover { background: rgba(255, 255, 255, .15); }
        }
    </style>
</head>
<body>
    <main class="card">
        <a class="logo" href="/index.html">
            <img src="/assets/img/logo-navbar.png" alt="">
            <span><span class="vh">Vui Học</span> <span class="th">Tiếng Hàn</span></span>
        </a>
        <p class="code" aria-hidden="true">404</p>
        <p class="ko" lang="ko">페이지를 찾을 수 없어요</p>
        <h1>Không tìm thấy trang</h1>
        <p>Trang bạn tìm có thể đã được đổi tên, chuyển đi hoặc chưa có. Hãy kiểm tra lại đường dẫn hoặc quay về trang chủ.</p>
        <div class="actions">
            <a class="btn btn-primary" href="/index.html">Về trang chủ</a>
            <button class="btn btn-ghost" type="button" onclick="history.length > 1 ? history.back() : location.href = '/index.html'">Quay lại</button>
        </div>
    </main>
</body>
</html>
