<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Thi Phần Viết | TOPIK II - Vui Học Tiếng Hàn</title>
    <link rel="icon" type="image/png" sizes="16x16"  href="/public/assets/img/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Luyện thi kỹ năng Viết TOPIK II theo bộ đề và theo dạng câu. Hướng dẫn chi tiết câu 51, 52, 53, 54.">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
        }

        body {
            font-family: 'Pretendard', 'Inter', sans-serif;
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0 0 40px 0;
        }

        * { box-sizing: border-box; }

        button, input, select { font-family: 'Pretendard', 'Inter', sans-serif !important; }

        /* ===== WRAPPER ===== */
        .wrapper {
            max-width: 900px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px; padding: 15px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            width: 100%;
         box-sizing: border-box;}

        /* ===== HERO ===== */
        .hero-section {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 50%, #db2777 100%);
            border-radius: 22px; padding: 34px 38px; color: #fff;
            margin-bottom: 28px; box-shadow: 0 18px 40px rgba(124,58,237,.18);
            display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 205px;
        }
        .hero-section::before {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);
            background-size: 22px 22px; opacity: .45; pointer-events: none;
        }
        .hero-blob { position: absolute; border-radius: 50%; filter: blur(64px); pointer-events: none; }
        .hero-blob.b1 { width: 230px; height: 230px; background: rgba(255,255,255,.22); top: -70px; right: -50px; animation: blobFloat 8s ease-in-out infinite; }
        .hero-blob.b2 { width: 170px; height: 170px; background: rgba(255,255,255,.14); bottom: -70px; left: -40px; animation: blobFloat 11s ease-in-out infinite reverse; }
        @keyframes blobFloat { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(14px,-12px) scale(1.08); } }

        .hero-left { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
        .hero-tag {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,.16); color: #fff;
            font-size: .8em; font-weight: 800; padding: 6px 14px; border-radius: 99px;
            letter-spacing: .6px; text-transform: uppercase;
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.24);
            margin-bottom: 14px;
        }
        .hero-title {
            font-size: 2.5em; font-weight: 900; margin: 0; line-height: 1.12; letter-spacing: -.6px;
            background: linear-gradient(120deg, #fff 35%, rgba(255,255,255,.5));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-sub { margin: 9px 0 0; font-size: .95em; color: rgba(255,255,255,.88); font-weight: 500; }

        /* TABS TRONG BANNER */
        .hero-tabs {
            display: flex; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);
            border-radius: 13px; padding: 5px; width: fit-content; margin-top: 20px; gap: 5px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .hero-tab {
            padding: 10px 30px; border-radius: 10px; color: rgba(255,255,255,.88);
            font-weight: 800; font-size: 1em; cursor: pointer; transition: all .25s ease;
            border: none; background: transparent;
        }
        .hero-tab.active { background: #fff; color: #6d28d9; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
        .hero-tab:not(.active):hover { background: rgba(255,255,255,.18); color: #fff; }

        .hero-right { position: relative; z-index: 1; flex-shrink: 0; }
        .hero-icon {
            width: 116px; height: 116px; border-radius: 50%;
            background: rgba(255,255,255,.16);
            border: 1.5px solid rgba(255,255,255,.34);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 22px 44px rgba(0,0,0,.22), inset 0 0 34px rgba(255,255,255,.12);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            animation: heroFloat 4s ease-in-out infinite;
        }
        @keyframes heroFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

        /* ===== SECTION HEADER ===== */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3); padding-bottom: 10px;
        }

        .section-title { font-size: 1.1em; font-weight: 800; margin: 0; color: var(--text-main); }

        /* ===== CARD LƯỚI ===== */
        .exam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        /* SECTION TOOLBAR */
        .section-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .section-toolbar select {
            padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
            font-size: 0.85em; background: rgba(255,255,255,0.85); color: var(--text-main);
            outline: none; cursor: pointer;
        }

        /* THẺ ĐỀ HIỆN ĐẠI */
        .exam-card {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 16px; text-decoration: none; color: var(--text-main);
            transition: all 0.25s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.03); min-height: 84px;
        }
        .exam-card:hover {
            transform: translateY(-3px); border-color: #fff;
            box-shadow: 0 12px 28px rgba(37,99,235,0.15);
        }
        .exam-cover {
            width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 900; font-size: 1.25em;
            box-shadow: 0 6px 14px rgba(0,0,0,0.18);
        }
        .exam-cover.cover-type { font-size: 1.5em; }
        .exam-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .exam-title { font-weight: 800; font-size: 1.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .exam-sub { font-size: 0.76em; color: var(--text-sub); font-weight: 600; }
        .exam-progress { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
        .exam-progress .pbar { flex: 1; height: 6px; background: rgba(0,0,0,0.08); border-radius: 99px; overflow: hidden; }
        .exam-progress .pbar i { display: block; height: 100%; background: linear-gradient(90deg, #2563eb, #06b6d4); border-radius: 99px; }
        .exam-progress span { font-size: 0.72em; color: var(--text-sub); font-weight: 700; white-space: nowrap; }
        .exam-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
        .exam-badge { font-size: 0.68em; font-weight: 800; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
        .badge-todo { background: #f1f5f9; color: #64748b; }
        .badge-done { background: #eff6ff; color: #1d4ed8; }
        .badge-high { background: #fef3c7; color: #b45309; }
        .badge-hot { background: #fff7ed; color: #c2410c; }
        .badge-new { background: #eff6ff; color: #1d4ed8; }
        .badge-points { background: #fdf4ff; color: #7e22ce; }

        .exam-arrow { color: #94a3b8; transition: 0.2s; flex-shrink: 0; }
        .exam-card:hover .exam-arrow { color: var(--primary); transform: translateX(3px); }

        @media (max-width: 600px) {
            .exam-grid { grid-template-columns: 1fr; }
            .exam-cover { width: 52px; height: 52px; font-size: 1.15em; border-radius: 14px; }
            .exam-card { padding: 14px 16px; gap: 14px; min-height: 96px; }
            .exam-title { font-size: 1.08em; }
        }

        /* ===== FOOTER ===== */
        .global-footer {
            max-width: 900px; margin: 10px auto 30px auto;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px;
            padding: 16px 20px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .footer-link {
            display: flex; align-items: center; gap: 10px; text-decoration: none;
            color: var(--text-main); font-weight: 700; font-size: 1.05em; transition: 0.2s;
        }
        .footer-link:hover { transform: translateY(-2px); color: #1877f2; }
        .footer-fb-icon { width: 22px; height: 22px; fill: currentColor; }

        @media (max-width: 600px) {
            .hero-section { padding: 26px 22px; flex-direction: column; align-items: flex-start; min-height: 0; }
            .hero-right { position: absolute; top: 18px; right: 14px; }
            .hero-icon { width: 60px; height: 60px; }
            .hero-icon svg { width: 30px !important; height: 30px !important; }
            .hero-title { padding-right: 64px; }
            .hero-title { white-space: nowrap; font-size: 1.35em; }
            .hero-sub { font-size: .86em; }
            .hero-tabs { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
            .hero-tab { padding: 11px 0; font-size: .98em; }
        }
    </style>

    <script src="../assets/js/block.js"></script>
    <script src="../assets/js/theme-picker.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/home-progress.js"></script>
    <script src="../assets/js/hero-rain.js"></script>
</head>

<body>
    <div class="wrapper">
        <div class="hero-section">
            <canvas class="hero-rain-canvas"></canvas>
            <div class="hero-blob b1"></div>
            <div class="hero-blob b2"></div>
            <div class="hero-left">
                <div class="hero-tag">✍️ Kỹ năng Viết</div>
                <h1 class="hero-title" id="heroTitle">Luyện theo bộ đề</h1>
                <p class="hero-sub">Nâng cao kỹ năng viết TOPIK.</p>
                <div class="hero-tabs">
                    <button class="hero-tab active" id="tabByExam" onclick="switchMode('exam')">Theo đề</button>
                    <button class="hero-tab" id="tabByType" onclick="switchMode('type')">Theo câu</button>
                </div>
            </div>
            <div class="hero-right">
                <div class="hero-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" width="54" height="54" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h3 class="section-title" id="modeTitle">📚 Chọn bộ đề</h3>
        </div>

        <div class="exam-grid" id="cardGrid">
            <!-- Render bằng JS -->
        </div>
    </div>

    <footer class="global-footer">
        <a href="https://www.facebook.com/groups/vuihoctienghan.online" target="_blank" rel="noopener noreferrer" class="footer-link">
            <span>📚 Vui Học Tiếng Hàn</span>
            <svg class="footer-fb-icon" viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
        </a>
    </footer>

    <script>
        // ===== DỮ LIỆU =====
        const EXAM_DATA = [35, 36, 37, 41, 47, 52, 60, 64, 83, 91, 96, 102];

        const TYPE_DATA = [
            { file: 'topik_ii/type51.html', label: 'Câu 51', desc: 'Điền vào chỗ trống', points: '10đ', badge: 'badge-new' },
            { file: 'topik_ii/type52.html', label: 'Câu 52', desc: 'Điền vào chỗ trống', points: '10đ', badge: 'badge-new' },
            { file: 'topik_ii/type53.html', label: 'Câu 53', desc: 'Phân tích số liệu', points: '30đ', badge: 'badge-hot' },
            { file: 'topik_ii/type54.html', label: 'Câu 54', desc: 'Viết luận văn', points: '50đ', badge: 'badge-points' },
        ];

        let currentMode = sessionStorage.getItem('writingMode') || 'exam';

        function switchMode(mode) {
            currentMode = mode;
            sessionStorage.setItem('writingMode', mode);
            document.getElementById('tabByExam').classList.toggle('active', mode === 'exam');
            document.getElementById('tabByType').classList.toggle('active', mode === 'type');
            document.getElementById('heroTitle').textContent = mode === 'exam' ? 'Luyện theo bộ đề' : 'Luyện theo dạng câu';
            document.getElementById('modeTitle').textContent = mode === 'exam' ? '📚 Chọn bộ đề' : '✍️ Chọn dạng câu';
            renderGrid();
        }

        const arrowSVG = `<svg class="exam-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>`;

        function renderGrid() {
            const grid = document.getElementById('cardGrid');
            let data;

            if (currentMode === 'exam') {
                data = EXAM_DATA.slice();
            } else {
                data = TYPE_DATA.slice();
            }

            if (data.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-sub); font-weight:700;">Không tìm thấy đề phù hợp 🔍</div>`;
                return;
            }

            if (currentMode === 'exam') {
                grid.innerHTML = data.map((num, idx) => {
                    const exam = window.HomeProgress.getExam(window.HomeProgress.keyFor('writing', 'topik_ii', num));
                    return window.HomeProgress.buildExamCard({
                        href: `topik_ii/topik${num}.html`,
                        title: `Đề viết ${num}`,
                        sub: 'TOPIK II',
                        coverNum: num,
                        exam: exam,
                        total: 54,
                        index: idx
                    });
                }).join('');
            } else {
                grid.innerHTML = data.map((t, idx) => {
                    return window.HomeProgress.buildTypeCard({
                        href: t.file,
                        title: t.label,
                        sub: t.desc,
                        coverText: '✍️',
                        index: idx,
                        badgeHtml: '<span class="exam-badge ' + (t.badge || 'badge-done') + '">' + (t.points || '') + '</span>'
                    });
                }).join('');
            }
        }

        if (window.HomeProgress) {
            window.HomeProgress.load('writing', function () {
                renderGrid();
            });
        }

        // Khởi động với mode đã lưu
        document.addEventListener('DOMContentLoaded', () => {
            if (currentMode === 'type') switchMode('type');
            else renderGrid();
        });
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="../auth.js"></script>
</body>

</html>
