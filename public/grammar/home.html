<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vui Học Tiếng Hàn - Ngữ Pháp Sơ Cấp</title>
    <link rel="icon" type="image/png" sizes="16x16"  href="/public/assets/img/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Danh sách ngữ pháp TOPIK sơ cấp — tổng hợp ngữ pháp sơ cấp 1 và sơ cấp 2.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
        }

        body {
            font-family: 'Pretendard', 'Inter', sans-serif;
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0 0 40px 0;
        }

        * { box-sizing: border-box; }

        button, input, select { font-family: 'Pretendard', 'Inter', sans-serif !important; }
        #authModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); z-index: 99999;
            justify-content: center; align-items: center;
        }
        .auth-box {
            background: #fff; padding: 40px 30px; border-radius: 16px;
            width: 90%; max-width: 350px; text-align: center; position: relative;
        }
        .auth-close {
            position: absolute; top: 15px; right: 20px; font-size: 1.5em; cursor: pointer;
            color: #64748b; background: none; border: none;
        }
        .auth-close:hover { color: #0f172a; }
        #googleAuthBtn {
            width: 100%; background: #fff; color: #0f172a; border: 1px solid #cbd5e0;
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 1em; transition: 0.2s;
        }
        #googleAuthBtn:hover { background: #f8fafc; }

        .wrapper {
            max-width: 900px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px;
            padding: 15px 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            width: 100%; box-sizing: border-box;
        }

        .hero-section {
            position: relative;
            background: linear-gradient(135deg, #065f46 0%, #10b981 50%, #0ea5e9 100%);
            border-radius: 22px; padding: 34px 38px; color: #fff; margin-bottom: 28px;
            box-shadow: 0 18px 40px rgba(16,185,129,.18);
            display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 205px;
        }
        .hero-bg { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; pointer-events: none; }
        .hero-bg::before {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);
            background-size: 22px 22px; opacity: .45;
        }
        .hero-blob { position: absolute; border-radius: 50%; filter: blur(64px); }
        .hero-blob.b1 { width: 230px; height: 230px; background: rgba(255,255,255,.22); top: -70px; right: -50px; animation: blobFloat 8s ease-in-out infinite; }
        .hero-blob.b2 { width: 170px; height: 170px; background: rgba(255,255,255,.14); bottom: -70px; left: -40px; animation: blobFloat 11s ease-in-out infinite reverse; }
        @keyframes blobFloat { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(14px,-12px) scale(1.08); } }

        .hero-left { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
        .hero-tag {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,.16); color: #fff;
            font-size: .8em; font-weight: 800; padding: 6px 14px; border-radius: 99px;
            letter-spacing: .6px; text-transform: uppercase;
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.24);
            margin-bottom: 14px;
        }
        .hero-title {
            font-size: 2.5em; font-weight: 900; margin: 0; line-height: 1.12; letter-spacing: -.6px;
            background: linear-gradient(120deg, #fff 35%, rgba(255,255,255,.5));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-sub { margin: 9px 0 0; font-size: .95em; color: rgba(255,255,255,.88); font-weight: 500; }

        /* DROPDOWN CHỌN CẤP ĐỘ */
        .level-dropdown { position: relative; margin-top: 20px; }
        .level-dropdown-btn {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.24);
            color: #fff; font-weight: 800; font-size: .98em; padding: 11px 18px; border-radius: 12px;
            cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: background .2s;
        }
        .level-dropdown-btn:hover { background: rgba(255,255,255,.26); }
        .level-dropdown-btn .chevron { transition: transform .25s; color: rgba(255,255,255,.85); }
        .level-dropdown.open .chevron { transform: rotate(180deg); }
        .level-dropdown-menu {
            position: absolute; top: calc(100% + 8px); left: 0; z-index: 50;
            min-width: 220px; background: rgba(255,255,255,.97); border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0,0,0,.18); overflow: hidden;
            display: none; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .level-dropdown.open .level-dropdown-menu { display: block; animation: dropIn .18s ease; }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .level-opt {
            display: block; width: 100%; text-align: left; padding: 11px 16px;
            background: none; border: none; cursor: pointer; font-size: .92em; font-weight: 600; color: #334155;
            transition: background .15s, color .15s;
        }
        .level-opt:hover { background: rgba(37,99,235,.08); color: #2563eb; }
        .level-opt.active { background: rgba(37,99,235,.12); color: #2563eb; font-weight: 800; }

        .hero-right { position: relative; z-index: 1; flex-shrink: 0; }
        .hero-icon {
            width: 116px; height: 116px; border-radius: 50%;
            background: rgba(255,255,255,.16);
            border: 1.5px solid rgba(255,255,255,.34);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 22px 44px rgba(0,0,0,.22), inset 0 0 34px rgba(255,255,255,.12);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            animation: heroFloat 4s ease-in-out infinite;
        }
        @keyframes heroFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px; border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }
        .section-title {
            font-size: 1.1em; font-weight: 800; margin: 0; color: var(--text-main);
        }

        .grammar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 1fr;
            gap: 14px;
        }

        .grammar-card {
            display: flex; align-items: center; gap: 14px; padding: 15px 16px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px; text-decoration: none; color: var(--text-main);
            transition: all 0.25s ease; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
            min-height: 96px; height: 100%; box-sizing: border-box;
        }
        .grammar-card:hover {
            transform: translateY(-3px); border-color: #fff;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.14);
        }
        .grammar-cover {
            width: 60px; height: 60px; border-radius: 14px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 900; font-size: .82em; letter-spacing: .3px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }
        .grammar-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .grammar-korean {
            font-size: 1.18em; font-weight: 800; letter-spacing: -0.3px; color: #1d4ed8;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .grammar-vietnamese {
            font-size: 0.85em; color: #64748b; font-weight: 500; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .grammar-arrow { color: #94a3b8; flex-shrink: 0; transition: 0.2s; }
        .grammar-card:hover .grammar-arrow { color: var(--primary); transform: translateX(2px); }

        .carousel-viewport {
            width: 100%; overflow: hidden; position: relative;
            touch-action: pan-y pinch-zoom; margin-bottom: 16px;
        }
        .carousel-track { display: flex; transition: transform 0.3s ease-out; will-change: transform; }
        .carousel-page { width: 100%; flex-shrink: 0; }

        .carousel-arrows {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 12px;
        }
        .carousel-arrow {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 0.9);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.3s; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            font-size: 1.4em; color: var(--primary); line-height: 1; user-select: none;
        }
        .carousel-arrow:hover { background: #fff; transform: scale(1.1); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.2); }
        .carousel-arrow:active { transform: scale(0.95); }

        .carousel-dots {
            display: flex; justify-content: center; gap: 8px; margin-bottom: 6px;
        }
        .carousel-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(0, 0, 0, 0.15); transition: 0.3s; cursor: pointer;
        }
        .carousel-dot.active { background: var(--primary); transform: scale(1.3); }

        .carousel-counter {
            text-align: center; font-size: 0.8em; color: var(--text-sub);
            font-weight: 600; margin-bottom: 10px;
        }

        .search-box {
            width: 100%; margin-bottom: 18px; position: relative;
        }
        .search-box input {
            width: 100%; padding: 14px 18px 14px 48px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 14px; font-size: 1em; outline: none;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            color: var(--text-main); transition: 0.3s;
        }
        .search-box input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .search-box input::placeholder { color: #94a3b8; }
        .search-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            font-size: 1.2em; color: #94a3b8; pointer-events: none;
        }

        .search-result-count {
            text-align: center; font-size: 0.85em; color: var(--text-sub);
            font-weight: 600; margin-bottom: 14px; display: none;
        }

        .clear-search-btn {
            display: none; margin: 0 auto 14px auto;
            background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 99px; padding: 6px 18px; font-size: 0.85em; font-weight: 600;
            color: var(--text-sub); cursor: pointer; transition: 0.2s;
        }
        .clear-search-btn:hover { background: #fff; color: var(--text-main); }

        .global-footer {
            max-width: 900px; margin: 10px auto 30px auto;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px;
            padding: 16px 20px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        .footer-link {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text-main);
            font-weight: 700; font-size: 1.05em;
            transition: transform 0.2s ease, color 0.2s;
        }
        .footer-link:hover { transform: translateY(-2px); color: #1877f2; }
        .footer-fb-icon { width: 22px; height: 22px; fill: currentColor; transition: 0.2s; }

        @media (max-width: 768px) {
            .grammar-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .grammar-cover { width: 50px; height: 50px; font-size: .78em; border-radius: 12px; }
            .grammar-card { padding: 12px 12px; min-height: 82px; }
            .grammar-korean { font-size: 1.05em; }
            .grammar-vietnamese { font-size: 0.78em; }
            .wrapper { padding: 10px 8px; border-radius: 16px;  width: 100%; box-sizing: border-box;}
            .hero-section { padding: 26px 22px; flex-direction: column; align-items: flex-start; min-height: 0; }
            .hero-right { position: absolute; top: 18px; right: 14px; }
            .hero-icon { width: 60px; height: 60px; }
            .hero-icon svg { width: 30px !important; height: 30px !important; }
            .hero-title { padding-right: 64px; }
            .hero-title { white-space: nowrap; font-size: 1.35em; }
            .hero-sub { font-size: .86em; }
            .level-dropdown-btn { width: 100%; justify-content: space-between; }
            .level-dropdown-menu { left: 0; right: 0; }
            .carousel-arrow { width: 38px; height: 38px; font-size: 1.2em; }
            .nav-desktop-links { display: none !important; }
        }
        @media (max-width: 520px) {
            .grammar-grid { grid-template-columns: 1fr; }
        }
    </style>
    <script src="../assets/js/block.js"></script>
    <script src="../assets/js/theme-picker.js"></script>
    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/hero-rain.js"></script>
</head>

<body>

        <div class="auth-box">

            <h2 style="color:#0f172a;margin-top:0;font-size:1.6em;font-weight:800;">Bắt đầu học</h2>
            <p style="color:#64748b;font-size:0.95em;margin-bottom:28px;">Đăng nhập để lưu tiến độ và từ vựng của bạn.</p>

    <div class="wrapper">

        <div class="hero-section">
            <div class="hero-bg"><canvas class="hero-rain-canvas"></canvas><div class="hero-blob b1"></div><div class="hero-blob b2"></div></div>

                <div class="hero-tag">📘 Ngữ pháp</div>

        <div class="search-box">

        <div class="carousel-viewport" id="carouselViewport">

        </div>
        <div class="carousel-arrows">
            <button class="carousel-arrow" id="arrowLeft" onclick="prevPage()" aria-label="Trang trước">&#8249;</button>
            <button class="carousel-arrow" id="arrowRight" onclick="nextPage()" aria-label="Trang sau">&#8250;</button>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
        <div class="carousel-counter" id="pageCounter"></div>

    </div>

    <script>
        const GRAMMAR_DATA = [
            // ===== SƠ CẤP 1 =====
            { korean: "은/는", vietnamese: "Tiểu từ chủ đề", file: "socap/은_는.html", level: 1 },
            { korean: "여기/거기/저기", vietnamese: "Đây/đó/kia (chỉ địa điểm)", file: "socap/여기_거기_저기.html", level: 1 },
            { korean: "이것/그것/저것", vietnamese: "Cái này/đó/kia (chỉ đồ vật)", file: "socap/이것_그것_저것.html", level: 1 },
            { korean: "이/가", vietnamese: "Tiểu từ chủ ngữ", file: "socap/이_가.html", level: 1 },
            { korean: "에 있다", vietnamese: "Ở tại (tồn tại)", file: "socap/에_있다.html", level: 1 },
            { korean: "이/가 아니다", vietnamese: "Không phải là (phủ định)", file: "socap/이_가_아니다.html", level: 1 },
            { korean: "입니다", vietnamese: "Là (trần thuật trang trọng)", file: "socap/입니다.html", level: 1 },
            { korean: "입니까", vietnamese: "Là... phải không? (nghi vấn)", file: "socap/입니까.html", level: 1 },
            { korean: "을/를", vietnamese: "Tiểu từ tân ngữ", file: "socap/을_를.html", level: 1 },
            { korean: "에서 (장소)", vietnamese: "Ở/tại (nơi hành động)", file: "socap/에서_장소.html", level: 1 },

        // Các cấp độ ngữ pháp (dropdown)
        const LEVEL_OPTIONS = [
            { val: 1, label: 'Sơ cấp 1' },
            { val: 2, label: 'Sơ cấp 2' },
            { val: 3, label: 'Trung cấp 3' },
            { val: 4, label: 'Trung cấp 4' },
            { val: 5, label: 'Cao cấp 5' },
            { val: 6, label: 'Cao cấp 6' },
            { val: 0, label: 'Tất cả' }
        ];
        // Nhãn cấp độ hiển thị trên ô màu của thẻ (có ý nghĩa hơn chữ cái đầu)
        function levelShort(val) {
            var map = { 1: 'SC1', 2: 'SC2', 3: 'TC3', 4: 'TC4', 5: 'CC5', 6: 'CC6' };
            return map[val] || 'TẤT CẢ';
        }
        function levelColor(val) {
            if (val >= 5) return 'linear-gradient(135deg,#7c3aed,#db2777)';
            if (val >= 3) return 'linear-gradient(135deg,#d97706,#f59e0b)';
            return 'linear-gradient(135deg,#2563eb,#06b6d4)';
        }
        function levelLabel(val) { var o = LEVEL_OPTIONS.find(function(x){ return x.val === val; }); return o ? o.label : 'Tất cả'; }

        let currentLevel = 1;
        let currentPage = 0;
        let totalPages = 0;
        let startX = 0;
        let isDragging = false;
        const itemsPerPage = 12;
        let searchQuery = '';
        const track = document.getElementById('grammarCarouselTrack');
        const dotsContainer = document.getElementById('carouselDots');
        const pageCounter = document.getElementById('pageCounter');

        function getFilteredData() {
            var data = currentLevel === 0
                ? GRAMMAR_DATA.slice()
                : GRAMMAR_DATA.filter(function(g) { return g.level === currentLevel; });
            if (searchQuery.trim()) {
                var q = searchQuery.trim().toLowerCase();
                data = data.filter(function(g) {
                    return g.korean.toLowerCase().includes(q) ||
                        g.vietnamese.toLowerCase().includes(q);
                });
            }
            return data;
        }

        function generateCard(item, idx) {
            return '<a href="' + item.file + '" class="grammar-card">' +
                '<span class="grammar-cover" style="background:' + levelColor(item.level) + ';">' + levelShort(item.level) + '</span>' +
                '<span class="grammar-body">' +
                    '<span class="grammar-korean">' + item.korean + '</span>' +
                    '<span class="grammar-vietnamese">' + item.vietnamese + '</span>' +
                '</span>' +
                '<svg class="grammar-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M9 18l6-6-6-6"/></svg>' +
                '</a>';
        }

        function renderCarousel(keepPage) {
            const data = getFilteredData();
            totalPages = Math.ceil(data.length / itemsPerPage);
            if (totalPages === 0) totalPages = 1;

            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            if (data.length === 0) {
                track.innerHTML = '<div class="carousel-page"><div class="grammar-grid"><div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-sub); font-weight:700;">Cấp độ này chưa có nội dung. Hãy chọn cấp độ khác nhé! 🚧</div></div></div>';
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';
                updatePageCounter();
                return;
            }

            if (keepPage && currentPage >= totalPages) currentPage = totalPages - 1;
            if (!keepPage) currentPage = 0;

            for (let i = 0; i < totalPages; i++) {
                const start = i * itemsPerPage;
                const chunk = data.slice(start, start + itemsPerPage);
                let pageHtml = '<div class="carousel-page"><div class="grammar-grid">';
                chunk.forEach(function(item, j) { pageHtml += generateCard(item, start + j); });
                pageHtml += '</div></div>';
                track.innerHTML += pageHtml;
                dotsContainer.innerHTML += '<div class="carousel-dot ' + (i === 0 ? 'active' : '') + '" onclick="goToPage(' + i + ')"></div>';
            }

            if (totalPages > 1) {
                var firstClone = track.firstElementChild.cloneNode(true);
                var lastClone = track.lastElementChild.cloneNode(true);
                track.appendChild(firstClone);
                track.insertBefore(lastClone, track.firstElementChild);
                track.style.transition = 'none';
                track.style.transform = 'translateX(-100%)';
            } else {
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';
            }

            updatePageCounter();
        }

        function updateSectionTitle() {
            var title = document.getElementById('sectionTitle');
            if (searchQuery.trim()) {
                title.textContent = '🔍 Kết quả tìm kiếm cho "' + searchQuery + '"';
            } else {
                title.textContent = '📖 Danh sách ngữ pháp ' + levelLabel(currentLevel);
            }
        }

        function renderLevelMenu() {
            var menu = document.getElementById('levelMenu');
            if (!menu) return;
            menu.innerHTML = LEVEL_OPTIONS.map(function(o) {
                return '<button class="level-opt' + (o.val === currentLevel ? ' active' : '') + '" onclick="setLevel(' + o.val + ')">' + o.label + '</button>';
            }).join('');
        }

        function toggleLevelMenu(e) {
            if (e) e.stopPropagation();
            var dd = document.getElementById('levelDropdown');
            if (dd) dd.classList.toggle('open');
        }

        function setLevel(level) {
            currentLevel = level;
            var dd = document.getElementById('levelDropdown');
            if (dd) dd.classList.remove('open');
            document.getElementById('levelDropdownLabel').textContent = levelLabel(level);
            sessionStorage.setItem('grammarLevel', level);
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            document.getElementById('searchResultCount').style.display = 'none';
            updateSectionTitle();
            renderCarousel(false);
            renderLevelMenu();
        }

        // Bấm ra ngoài thì đóng dropdown
        document.addEventListener('click', function() {
            var dd = document.getElementById('levelDropdown');
            if (dd) dd.classList.remove('open');
        });

        function updateDots(index) {
            var dots = document.querySelectorAll('.carousel-dot');
            dots.forEach(function(d) { d.classList.remove('active'); });
            if (dots[index]) dots[index].classList.add('active');
        }

        function updatePageCounter() {
            pageCounter.textContent = 'Trang ' + (currentPage + 1) + ' / ' + totalPages;
        }

        function goToPage(index, withTransition) {
            if (totalPages <= 1) { currentPage = 0; return; }
            currentPage = index;
            if (withTransition !== false) track.style.transition = 'transform 0.3s ease-out';
            else track.style.transition = 'none';
            track.style.transform = 'translateX(-' + ((index + 1) * 100) + '%)';
            updateDots(index);
            updatePageCounter();
        }

        function prevPage() {
            if (totalPages <= 1) return;
            currentPage--;
            track.style.transition = 'transform 0.3s ease-out';
            track.style.transform = 'translateX(-' + ((currentPage + 1) * 100) + '%)';
            if (currentPage < 0) {
                updateDots(totalPages - 1);
                setTimeout(function() { currentPage = totalPages - 1; goToPage(currentPage, false); }, 300);
            } else { updateDots(currentPage); }
        }

        function nextPage() {
            if (totalPages <= 1) return;
            currentPage++;
            track.style.transition = 'transform 0.3s ease-out';
            track.style.transform = 'translateX(-' + ((currentPage + 1) * 100) + '%)';
            if (currentPage >= totalPages) {
                updateDots(0);
                setTimeout(function() { currentPage = 0; goToPage(0, false); }, 300);
            } else { updateDots(currentPage); }
        }

        function onSearch() {
            searchQuery = document.getElementById('searchInput').value;
            if (searchQuery.trim()) {
                document.getElementById('clearSearchBtn').style.display = 'block';
                var data = getFilteredData();
                document.getElementById('searchResultCount').style.display = 'block';
                document.getElementById('searchResultCount').textContent = 'Tìm thấy ' + data.length + ' kết quả';
            } else {
                document.getElementById('clearSearchBtn').style.display = 'none';
                document.getElementById('searchResultCount').style.display = 'none';
            }
            sessionStorage.setItem('grammarQuery', searchQuery);
            updateSectionTitle();
            renderCarousel(false);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            document.getElementById('searchResultCount').style.display = 'none';
            sessionStorage.setItem('grammarQuery', '');
            updateSectionTitle();
            renderCarousel(false);
        }

        track.addEventListener('touchstart', function(e) {
            if (totalPages <= 1) return;
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        });
        track.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            var diff = startX - e.touches[0].clientX;
            track.style.transform = 'translateX(-' + ((currentPage + 1) * track.clientWidth + diff) + 'px)';
        });
        track.addEventListener('touchend', function(e) {
            if (!isDragging) return;
            isDragging = false;
            var diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) { diff > 0 ? nextPage() : prevPage(); }
            else { track.style.transition = 'transform 0.3s ease-out'; track.style.transform = 'translateX(-' + ((currentPage + 1) * 100) + '%)'; }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevPage();
            else if (e.key === 'ArrowRight') nextPage();
        });

        function restoreState() {
            var savedLevel = sessionStorage.getItem('grammarLevel');
            var savedPage = sessionStorage.getItem('grammarPage');
            var savedQuery = sessionStorage.getItem('grammarQuery');

            if (savedLevel && LEVEL_OPTIONS.some(function(o) { return o.val === parseInt(savedLevel); })) {
                currentLevel = parseInt(savedLevel);
            }
            var lbl = document.getElementById('levelDropdownLabel');
            if (lbl) lbl.textContent = levelLabel(currentLevel);
            if (savedQuery) {
                searchQuery = savedQuery;
                document.getElementById('searchInput').value = savedQuery;
                if (savedQuery.trim()) {
                    document.getElementById('clearSearchBtn').style.display = 'block';
                    document.getElementById('searchResultCount').style.display = 'block';
                }
            }
            renderLevelMenu();
        }

        window.addEventListener('pageshow', function() {
            restoreState();
            updateSectionTitle();
            renderCarousel(true);
            var savedPage = sessionStorage.getItem('grammarPage');
            if (savedPage && parseInt(savedPage) < totalPages) {
                goToPage(parseInt(savedPage));
            }
        });

        window.addEventListener('beforeunload', function() {
            sessionStorage.setItem('grammarLevel', currentLevel);
            sessionStorage.setItem('grammarPage', currentPage);
        });

        updateSectionTitle();
        restoreState();
        renderCarousel(true);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (typeof firebase !== 'undefined' && firebase.auth) {
                    firebase.auth().onAuthStateChanged(function(user) {
                        var btn = document.getElementById('navAvatarBtn');
                        if (!btn) return;
                        if (user) {
                            btn.style.color = '#2563eb'; btn.style.background = '#eff6ff';
                            btn.style.borderRadius = '8px';
                            btn.title = 'Tài khoản (' + (user.displayName || user.email) + ')';
                            btn.onclick = function() { window.location.href = '../mypage.html'; };
                        } else {
                            btn.style.color = '#0f172a'; btn.style.background = '';
                            btn.title = 'Chưa đăng nhập — Nhấn để đăng nhập';
                            btn.onclick = function() {
                                document.getElementById('authModal').style.display = 'flex';
                            };
                        }
                    });
                }
            }, 300);
        });
    </script>
    <script src="../auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/menu.js"></script>
</body>

</html>
