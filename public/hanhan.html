    '추': 'Gốc Hán <b>秋</b> (thu), <b>推</b> (thôi), <b>追</b> (truy). <b>秋</b> — mùa thu: 추석 (秋夕 = Tết Trung Thu), 추천 (秋千 = xích đu). <b>推</b> — đề xuất, suy đoán, đẩy lên: 추천 (推薦 = đề cử/giới thiệu), 추측 (推測 = suy đoán/phỏng đoán), 추진 (推進 = thúc đẩy). <b>追</b> — đuổi theo, truy đuổi, hồi tưởng: 추억 (追憶 = hồi ức/kỷ niệm), 추가 (追加 = thêm vào/bổ sung), 추구 (追求 = theo đuổi), 추적 (追跡 = truy vết). Mẹo: <b>추</b> + mùa → 秋; <b>추</b> + đẩy/đề cử → 推; <b>추</b> + theo/đuổi → 追. 추천 và 추가 đều rất quan trọng và hay gặp.',
    '최': 'Gốc Hán <b>最</b> — nghĩa là "nhất, tối, cực kỳ, cao nhất". Đây là gốc Hán chỉ mức độ tuyệt đối, đứng đầu hoặc vượt trội hơn tất cả. <b>最</b> xuất hiện trong: 최고 (最高 = cao nhất/tốt nhất — "tối" + "cao"), 최선 (最善 = hết sức/tốt nhất có thể), 최대 (最大 = tối đa — "tối" + "lớn"), 최초 (最初 = đầu tiên/ban đầu nhất), 최근 (最近 = gần đây nhất), 최종 (最終 = cuối cùng), 최적 (最適 = tối ưu). Mẹo: 100% từ có <b>최</b> đứng đầu đều mang nghĩa "nhất, tối, cao nhất". 최근 là từ sẽ gặp trong hầu hết các bài đọc TOPIK.',
    '취': 'Gốc Hán <b>取</b> (thủ), <b>趣</b> (thú), <b>就</b> (tựu). <b>取</b> — nghĩa là "lấy, thu thập, hủy bỏ": 취소 (取消 = hủy bỏ — "lấy" + "biến mất"), 채취 (採取 = thu thập/khai thác), 취득 (取得 = đạt được/giành lấy). <b>趣</b> — nghĩa là "sở thích, hứng thú": 취미 (趣味 = sở thích), 흥취 (興趣 = hứng thú/niềm vui). <b>就</b> — nghĩa là "tựu, theo đuổi, nhậm chức": 취직 (就職 = xin việc/kiếm việc làm — "tựu" + "chức"), 취업 (就業 = có việc làm/đi làm). Mẹo: <b>취</b> + lấy/hủy → 取; <b>취</b> + sở thích → 趣; <b>취</b> + công việc → 就. 취미, 취소, 취직 là ba từ TOPIK cơ bản nhất cần ghi nhớ.',
'전': 'Gốc Hán <b>前</b> (trước), <b>全</b> (toàn), <b>電</b> (điện), <b>戰</b> (chiến), <b>傳</b> (truyền) — một trong những âm đa nghĩa nhất tiếng Hàn. <b>前</b> chỉ thời gian phía trước: 이전 (以前 = trước đây), 오전 (午前 = buổi sáng). <b>全</b> chỉ sự toàn vẹn: 완전 (完全 = hoàn toàn), 전체 (全體 = toàn thể), 안전 (安全 = an toàn). <b>電</b> liên quan đến điện: 전화 (電話 = điện thoại), 전기 (電氣 = điện). <b>戰</b> là chiến tranh: 전쟁 (戰爭 = chiến tranh). <b>傳</b> là truyền lại: 전통 (傳統 = truyền thống). Mẹo: thấy <b>전</b>, nhìn từ ghép để xác định đúng nghĩa.',

'책': 'Gốc Hán <b>責</b> (trách nhiệm) và <b>策</b> (sách lược). <b>責</b> xuất hiện trong 책임 (責任 = trách nhiệm), một từ cực quan trọng trong giao tiếp và TOPIK. <b>策</b> có trong 정책 (政策 = chính sách), 대책 (對策 = đối sách/giải pháp). Mẹo: <b>책</b> + nhiệm vụ → 責. <b>책</b> + kế hoạch → 策. Đừng nhầm với 책 (冊 = sách/quyển sách) là âm thuần Hàn.',

'충': 'Gốc Hán <b>充</b> (đầy đủ), <b>衝</b> (xung đột/va chạm), <b>忠</b> (trung thành). <b>充</b> → 충분 (充分 = đầy đủ), 충전 (充電 = sạc pin). <b>衝</b> → 충격 (衝擊 = va chạm/cú sốc), 충돌 (衝突 = va chạm). <b>忠</b> → 충고 (忠告 = lời khuyên chân thành). Mẹo: <b>충</b> + đầy/đủ → 充. <b>충</b> + va đập → 衝. <b>충</b> + lòng trung → 忠.',

'모': 'Gốc Hán <b>母</b> (mẫu/mẹ) và <b>模</b> (mô hình/hình mẫu). <b>母</b> có trong 부모 (父母 = cha mẹ), 모국 (母國 = đất mẹ/quê hương), 모국어 (母國語 = tiếng mẹ đẻ). <b>模</b> xuất hiện trong 모양 (模樣 = hình dạng), 모범 (模範 = gương mẫu/kiểu mẫu), 모방 (模倣 = bắt chước). Mẹo: <b>모</b> + gia đình → 母. <b>모</b> + hình thái → 模.',

'죄': 'Gốc Hán <b>罪</b> — nghĩa là "tội lỗi, tội phạm". 죄송 (罪悚 = xin lỗi) là từ lịch sự phổ biến nhất trong tiếng Hàn, nghĩa gốc là "tội lỗi khiến tôi hổ thẹn". 범죄 (犯罪 = phạm tội), 죄인 (罪人 = tội nhân). Mẹo: <b>죄</b> luôn mang nghĩa tiêu cực liên quan đến lỗi lầm hoặc phạm pháp.',

'완': 'Gốc Hán <b>完</b> — nghĩa là "hoàn toàn, hoàn tất". 완전 (完全 = hoàn toàn), 완성 (完成 = hoàn thành), 완료 (完了 = hoàn tất/đã xong), 완벽 (完璧 = hoàn hảo). Mẹo: <b>완</b> luôn đứng đầu từ ghép và 100% mang nghĩa "hoàn toàn/trọn vẹn". Rất dễ nhận biết trong bài đọc.',

'산': 'Gốc Hán <b>山</b> (sơn = núi), <b>産</b> (sản = sinh ra), <b>算</b> (toán = tính toán). <b>山</b> → 등산 (登山 = leo núi), 산책 (散策 = đi dạo). <b>産</b> → 생산 (生産 = sản xuất), 산업 (産業 = công nghiệp/sản nghiệp). <b>算</b> → 계산 (計算 = tính toán), 예산 (豫算 = dự toán/ngân sách). Mẹo: <b>산</b> đầu từ về địa lý → 山. <b>산</b> cuối từ → thường là 産.',

'창': 'Gốc Hán <b>窓</b> (song = cửa sổ) và <b>創</b> (sáng = sáng tạo). <b>窓</b> → 창문 (窓門 = cửa sổ), 창밖 (窓밖 = bên ngoài cửa sổ). <b>創</b> → 창작 (創作 = sáng tác), 창의 (創意 = sáng ý/sáng tạo), 창업 (創業 = khởi nghiệp). Mẹo: <b>창</b> + vật thể → 窓 (cửa sổ). <b>창</b> + ý tưởng → 創 (sáng tạo).',

'철': 'Gốc Hán <b>鐵</b> (thiết = sắt) và <b>哲</b> (triết = triết lý). <b>鐵</b> → 지하철 (地下鐵 = tàu điện ngầm), 철도 (鐵道 = đường sắt), 철강 (鐵鋼 = sắt thép). <b>哲</b> → 철학 (哲學 = triết học). Mẹo: <b>철</b> + giao thông/xây dựng → 鐵. <b>철</b> + tư tưởng → 哲.',

'토': 'Gốc Hán <b>土</b> (thổ = đất) và <b>討</b> (thảo = thảo luận). <b>土</b> → 토요일 (土曜日 = thứ Bảy — ngày của đất), 토지 (土地 = đất đai). <b>討</b> → 토론 (討論 = thảo luận), 토의 (討議 = thảo luận/bàn bạc). Mẹo: <b>토</b> + ngày trong tuần → 土. <b>토</b> + trao đổi ý kiến → 討.',

'즉': 'Gốc Hán <b>卽</b> — nghĩa là "tức là, ngay lập tức". 즉시 (卽時 = ngay lập tức), 즉석 (卽席 = tại chỗ), 즉각 (卽刻 = lập tức). Mẹo: <b>즉</b> luôn mang nghĩa "tức thời, ngay". Từ chứa <b>즉</b> luôn chỉ hành động xảy ra không chậm trễ.',

'타': 'Gốc Hán <b>他</b> — nghĩa là "người khác, cái khác". 타인 (他人 = người khác), 타국 (他國 = nước khác). Ngoài ra còn có nghĩa "thỏa hiệp" trong 타협 (妥協 = thỏa hiệp), nhưng ở đây dùng Hanja khác là 妥. Mẹo: <b>타</b> + danh từ chỉ đối tượng → "cái/người khác".',

'파': 'Gốc Hán <b>破</b> (phá hủy) và <b>派</b> (phái cử). <b>破</b> → 파괴 (破壞 = phá hủy), 파산 (破産 = phá sản). <b>派</b> → 파견 (派遣 = phái cử), 파티 (派對 = bữa tiệc — từ mượn). Cũng có 파도 (波濤 = sóng biển) dùng Hanja 波. Mẹo: <b>파</b> + hủy hoại → 破. <b>파</b> + cử đi → 派.',

'포': 'Gốc Hán <b>包</b> (bao bọc) và <b>抛</b> (phao = vứt bỏ). <b>包</b> → 포함 (包含 = bao hàm/bao gồm), 포장 (包裝 = đóng gói). <b>抛</b> → 포기 (抛弃 = từ bỏ). Mẹo: <b>포</b> + chứa đựng → 包. <b>포</b> + buông bỏ → 抛.',

'착': 'Gốc Hán <b>着</b> — nghĩa là "mặc, đeo, đến nơi, bám vào". Đây là một gốc rất đa dụng: 착용 (着用 = mặc/đeo), 착륙 (着陸 = hạ cánh/đáp xuống), 도착 (到着 = đến nơi), 정착 (定着 = định cư), 착각 (錯覺 = ảo giác). <b>착</b> cũng có trong 착하다 (tốt bụng) nhưng đây là từ thuần Hàn. Mẹo: <b>착</b> trong từ Hán-Hàn luôn mang nghĩa "dính/bám/đến/mặc".',

'패': 'Gốc Hán <b>敗</b> — nghĩa là "thất bại, đánh bại". 실패 (失敗 = thất bại), 패배 (敗北 = thua trận), 낙패 (落敗 = thất bại). Đối nghĩa với 승 (勝 = thắng). Mẹo: <b>패</b> luôn mang nghĩa tiêu cực — thua, hỏng, thất bại.',

'촬': 'Gốc Hán <b>撮</b> — nghĩa là "chụp, quay phim, ghi hình". 촬영 (撮影 = chụp ảnh/quay phim), 촬영기 (撮影機 = máy quay), 촬화 (撮畵 = chụp ảnh). Mẹo: <b>촬</b> hầu như luôn đi với 영 (影) để tạo nghĩa "chụp ảnh/quay phim".',

'퇴': 'Gốc Hán <b>退</b> — nghĩa là "thoái lui, rời khỏi, tan làm". 퇴근 (退勤 = tan làm), 퇴사 (退社 = nghỉ việc/thôi việc), 퇴장 (退場 = rời khỏi), 퇴원 (退院 = xuất viện). Mẹo: <b>퇴</b> luôn mang nghĩa "rời đi, lui về". Trái nghĩa với 출 (出 = xuất phát/đi).', 

'피': 'Gốc Hán <b>被</b> (bị = bị động/chịu đựng) và <b>疲</b> (bì = mệt mỏi). <b>被</b> → 피해 (被害 = thiệt hại/bị hại), 피동 (被動 = bị động). <b>疲</b> → 피로 (疲勞 = mệt mỏi), 피곤 (疲困 = mệt nhọc). Còn có 피부 (皮膚 = làn da) dùng Hanja 皮 (bì = da). Mẹo: <b>피</b> + tổn thất → 被. <b>피</b> + mệt → 疲. <b>피</b> + cơ thể → 皮.',

'하': 'Gốc Hán <b>下</b> — nghĩa là "dưới, hạ xuống, giảm xuống". 지하 (地下 = dưới đất/ngầm), 이하 (以下 = trở xuống/trở về sau), 하락 (下落 = hạ xuống/giảm), 하향 (下向 = đi xuống). Đối lập với 상 (上 = trên). Mẹo: 100% từ có <b>하</b> mang nghĩa "dưới". Rất dễ nhận biết.',

'할': 'Gốc Hán <b>割</b> — nghĩa là "cắt, chia, phân chia". 할인 (割引 = giảm giá — nghĩa gốc: cắt bớt giá), 할부 (割賦 = trả góp — chia ra trả), 분할 (分割 = phân chia), 할당 (割當 = phân bổ). Mẹo: <b>할</b> luôn liên quan đến việc "cắt/chia" một thứ gì đó.',

'핵': 'Gốc Hán <b>核</b> — nghĩa là "hạt nhân, cốt lõi". 핵심 (核心 = cốt lõi/trọng tâm), 핵무기 (核武器 = vũ khí hạt nhân), 핵가족 (核家族 = gia đình hạt nhân), 핵폭탄 (核爆彈 = bom hạt nhân). Mẹo: <b>핵</b> luôn chỉ phần trung tâm, quan trọng nhất của cái gì đó.',

'혁': 'Gốc Hán <b>革</b> — nghĩa là "cách mạng, đổi mới, cải cách". 혁신 (革新 = đổi mới/cách tân), 개혁 (改革 = cải cách), 혁명 (革命 = cách mạng). Mẹo: <b>혁</b> luôn mang nghĩa thay đổi lớn lao, triệt để về mặt xã hội hoặc tổ chức.',

'협': 'Gốc Hán <b>協</b> — nghĩa là "hợp tác, hiệp lực". 협력 (協力 = hợp tác), 협회 (協會 = hiệp hội), 타협 (妥協 = thỏa hiệp), 협의 (協議 = hội ý/bàn bạc). Mẹo: <b>협</b> luôn chỉ sự cùng làm việc, cùng nhau nỗ lực giữa nhiều bên.',

'홍': 'Gốc Hán <b>紅</b> (hồng = màu đỏ) và <b>弘</b> (hoằng = rộng lớn). <b>紅</b> → 홍차 (紅茶 = trà đen/hồng trà), 홍수 (洪水 = lũ lụt — nước đỏ/đục). <b>弘</b> → 홍보 (弘報 = quảng bá/tuyên truyền rộng rãi). Mẹo: <b>홍</b> + màu sắc/đồ uống → 紅. <b>홍</b> + truyền thông → 弘.',

'술': 'Gốc Hán <b>術</b> — nghĩa là "kỹ thuật, nghệ thuật, phương pháp". 기술 (技術 = kỹ thuật), 미술 (美術 = mỹ thuật), 수술 (手術 = phẫu thuật), 예술 (藝術 = nghệ thuật). Mẹo: <b>술</b> luôn đứng cuối từ ghép, chỉ một kỹ năng hoặc phương pháp làm gì đó.',

'응': 'Gốc Hán <b>應</b> — nghĩa là "ứng đáp, phản ứng, đối phó". 반응 (反應 = phản ứng), 응답 (應答 = trả lời/đáp lời), 대응 (對應 = đối phó/ứng phó), 응원 (應援 = cổ vũ/ủng hộ), 적용 (適用 = áp dụng). <b>응</b> luôn chỉ hành động đáp lại một kích thích hoặc yêu cầu nào đó. Mẹo: khi có người nói/cho điều gì, <b>응</b> là hành động đáp trả.',

'색': 'Gốc Hán <b>色</b> — nghĩa là "màu sắc, sắc thái". 색깔 (色깔 = màu sắc), 색상 (色相 = tông màu), 특색 (特色 = đặc sắc/nét riêng), 색채 (色彩 = sắc màu), 무색 (無色 = không màu). Mẹo: <b>색</b> luôn liên quan đến màu sắc, cả nghĩa đen lẫn nghĩa bóng.',

'욕': 'Gốc Hán <b>慾</b> (dục = ham muốn) và <b>浴</b> (dục = tắm). <b>慾</b> → 욕심 (慾心 = lòng tham), 탐욕 (貪慾 = tham lam). <b>浴</b> → 목욕 (沐浴 = tắm rửa), 욕실 (浴室 = phòng tắm). Mẹo: <b>욕</b> + tâm lý → 慾 (ham muốn). <b>욕</b> + nước/sạch sẽ → 浴 (tắm rửa).',

'채': 'Gốc Hán <b>菜</b> (thái = rau) và <b>採</b> (thái = thu hái/tuyển dụng). <b>菜</b> → 야채 (野菜 = rau quả), 채소 (菜蔬 = rau xanh). <b>採</b> → 채용 (採用 = tuyển dụng), 채집 (採集 = thu thập). Mẹo: <b>채</b> + thực phẩm → 菜. <b>채</b> + lựa chọn/thu nhận → 採.'
};


var currentPage = 0;
var totalPages = 0;

function renderGrid() {
    var track = document.getElementById('rootCarouselTrack');
    var dots = document.getElementById('carouselDots');
    track.innerHTML = '';
    dots.innerHTML = '';

    var perPage = 15; // default desktop (5x3)
    if (window.innerWidth <= 480) {
        perPage = 12; // phone (4x3)
    } else if (window.innerWidth <= 768) {
        perPage = 16; // tablet (4x4)
    }

    totalPages = Math.ceil(hanDict.length / perPage);

    for (var p = 0; p < totalPages; p++) {
        var start = p * perPage;
        var chunk = hanDict.slice(start, start + perPage);
        var html = '<div class="carousel-page">';
        chunk.forEach(function(item) {
            html += '<div class="root-card' + (currentRoot && currentRoot.root === item.root ? ' active' : '') + '" onclick="selectRoot(\'' + item.root + '\')">' +
                '<div class="root-syl">' + item.root + '</div>' +
                '<div class="root-mean">' + item.meaning + '</div>' +
                '</div>';
        });
        html += '</div>';
        track.innerHTML += html;
        dots.innerHTML += '<div class="carousel-dot' + (p === 0 ? ' active' : '') + '" onclick="goToPage(' + p + ')"></div>';
    }

    currentPage = 0;
    track.style.transform = 'translateX(0%)';
    updatePageIndicator();
}
function goToPage(idx) {
    if (idx < 0 || idx >= totalPages) return;
    currentPage = idx;
    var track = document.getElementById('rootCarouselTrack');
    track.style.transition = 'transform .3s ease-out';
    track.style.transform = 'translateX(-' + (idx * 100) + '%)';
    var dots = document.querySelectorAll('.carousel-dot');
    dots.forEach(function(d, i) { d.classList.toggle('active', i === idx); });
    updatePageIndicator();
}

function updatePageIndicator() {
    var el = document.getElementById('pageIndicator');
    if (el) el.textContent = (currentPage + 1) + ' / ' + totalPages;
}

function jumpToPage() {
    var input = document.getElementById('pageJump');
    var target = parseInt(input.value, 10);
    if (isNaN(target) || target < 1 || target > totalPages) { input.value = ''; return; }
    goToPage(target - 1);
    input.value = '';
}

function prevPage() { goToPage(currentPage - 1); }
function nextPage() { goToPage(currentPage + 1); }

// Touch swipe
(function() {
    var track = document.getElementById('rootCarouselTrack');
    var startX = 0, isDragging = false;
    track.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; isDragging = true; track.style.transition = 'none'; });
    track.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        var diff = startX - e.touches[0].clientX;
        track.style.transform = 'translateX(-' + (currentPage * 100) + '%) translateX(-' + diff + 'px)';
    });
    track.addEventListener('touchend', function(e) {
        if (!isDragging) return;
        isDragging = false;
        var diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) goToPage(currentPage + (diff > 0 ? 1 : -1));
        else goToPage(currentPage);
    });
})();

// Arrow key navigation
document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') prevPage();
    if (e.key === 'ArrowRight') nextPage();
});

function selectRoot(syl, isRandom) {
    window._isRandomMode = !!isRandom;
    if (!window._gridPageBefore) window._gridPageBefore = currentPage;
    currentRoot = hanDict.find(function(d) { return d.root === syl; });
    document.getElementById('mmOverlay').classList.add('show');
    renderGrid();
    goToPage(window._gridPageBefore);
    renderMindmap();
    translateExBatch(currentRoot);
}

function navRoot(dir) {
    if (window._isRandomMode) {
        randomRoot();
    } else {
        var idx = hanDict.findIndex(function(d) { return d.root === currentRoot.root; });
        var newIdx = (idx + dir + hanDict.length) % hanDict.length;
        selectRoot(hanDict[newIdx].root, false);
    }
}

function translateExBatch(rootObj) {
    if (rootObj.translated) return;
    var validIdxs = [];
    var textsToTranslate = [];
    rootObj.words.forEach(function(w, i) {
        if (w.ex && w.ex.trim()) { validIdxs.push(i); textsToTranslate.push(w.ex); }
    });
    if (textsToTranslate.length === 0) { rootObj.translated = true; return; }
    
    // Join with a unique separator that Google Translate usually respects
    var joined = textsToTranslate.join('\n~\n');
    var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=vi&dt=t&q=' + encodeURIComponent(joined);
    
    fetch(url).then(function(res) { return res.json(); }).then(function(data) {
        var translatedFull = '';
        if (data && data[0]) {
            for (var i = 0; i < data[0].length; i++) { translatedFull += data[0][i][0]; }
        }
        var translatedParts = translatedFull.split('~').map(function(s) { return s.trim(); });
        validIdxs.forEach(function(originalIdx, i) {
            rootObj.words[originalIdx].ex_vi = translatedParts[i] || '';
        });
        rootObj.translated = true;
        // Auto-update popup if currently open
        if (document.getElementById('wdPopup').classList.contains('show') && window._activeWordIdx != null) {
            showDetail(window._activeWordIdx);
        }
    }).catch(function(err) {
        console.error('Translation error:', err);
        var loadingEl = document.getElementById('wdExViLoading');
        if (loadingEl) loadingEl.innerText = 'Không thể tải bản dịch.';
    });
}

function closeMindmap() {
    if (window._mmLineRaf) { cancelAnimationFrame(window._mmLineRaf); window._mmLineRaf = null; }
    document.getElementById('mmOverlay').classList.remove('show');
    var saved = window._gridPageBefore || 0;
    currentRoot = null;
    renderGrid();
    if (saved < totalPages) {
        var track = document.getElementById('rootCarouselTrack');
        track.style.transition = 'none';
        currentPage = saved;
        track.style.transform = 'translateX(-' + (saved * 100) + '%)';
        var dots = document.querySelectorAll('.carousel-dot');
        dots.forEach(function(d, i) { d.classList.toggle('active', i === saved); });
        updatePageIndicator();
    }
    delete window._gridPageBefore;
}

function searchRoot() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) return;
    // Tìm chính xác gốc trước
    var found = hanDict.find(function(d) { return d.root === q; });
    // Nếu không có, tìm gốc chứa ký tự
    if (!found) found = hanDict.find(function(d) { return d.root.includes(q); });
    // Cuối cùng tìm theo nghĩa
    if (!found) found = hanDict.find(function(d) { return d.meaning.toLowerCase().includes(q); });
    if (found) { selectRoot(found.root); document.getElementById('searchInput').value = ''; }
    else { alert('Không tìm thấy gốc "' + q + '"'); }
}

function randomRoot() {
    selectRoot(hanDict[Math.floor(Math.random() * hanDict.length)].root, true);
}

function renderMindmap() {
    var canvas = document.getElementById('mmCanvas');
    var title = document.getElementById('mmTitle');
    if (!currentRoot) { canvas.innerHTML = ''; return; }

    title.innerHTML = 'Gốc <strong>' + currentRoot.root + '</strong> — ' + currentRoot.meaning + ' (' + currentRoot.words.length + ' từ)';

    // Force layout before reading dimensions
    var popup = document.getElementById('mmPopup');
    var W = popup.clientWidth - 28 || 1000;
    var H = popup.clientHeight - 60 || 650;
    var cx = W / 2, cy = H / 2;

    var words = currentRoot.words;
    var golden = Math.PI * (3 - Math.sqrt(5));
    // Wider spread: scale based on 38% of shorter dimension, min radius 90px
    var minR = Math.min(W, H) * 0.18;
    var maxR = Math.min(W * 0.44, H * 0.44);
    var colors = ['#eff6ff','#f0fdf4','#fefce8','#fdf2f8','#f5f3ff','#fff7ed','#ecfdf5','#fef2f2'];
    var pos = [];
    var nodeW = 130, nodeH = 48; // approximate node dimensions

    // Use sunflower/phyllotaxis + per-node radius jitter for varied line lengths
    for (var i = 0; i < words.length; i++) {
        var a = i * golden;
        var t = (i + 1) / words.length;
        var baseR = minR + (maxR - minR) * (0.25 + 0.75 * Math.sqrt(t));
        // ±35% jitter — some nodes clearly near, some far
        var jitter = 0.65 + Math.random() * 0.70;
        var r = Math.max(minR * 0.55, Math.min(maxR, baseR * jitter));
        var nx = cx + r * Math.cos(a) - nodeW / 2;
        var ny = cy + r * Math.sin(a) - nodeH / 2;
        
        // Avoid overlapping with left/right arrows
        if (ny + nodeH > cy - 45 && ny < cy + 45) {
            if (nx < 75) nx = 75;
            if (nx + nodeW > W - 75) nx = W - nodeW - 75;
        }
        
        nx = Math.max(4, Math.min(W - nodeW - 4, nx));
        ny = Math.max(4, Math.min(H - nodeH - 4, ny));
        pos.push({ x: nx, y: ny, ox: nx, oy: ny, color: colors[i % colors.length] });
    }

    // Collision relaxation to prevent overlapping nodes (15 iterations)
    for (var iter = 0; iter < 15; iter++) {
        for (var i = 0; i < pos.length; i++) {
            for (var j = i + 1; j < pos.length; j++) {
                var dx = pos[i].ox - pos[j].ox;
                var dy = pos[i].oy - pos[j].oy;
                var distX = Math.abs(dx), distY = Math.abs(dy);
                if (distX < nodeW + 6 && distY < nodeH + 6) {
                    var overlapX = (nodeW + 6) - distX;
                    var overlapY = (nodeH + 6) - distY;
                    if (overlapX < overlapY) {
                        var push = overlapX / 2 + 1;
                        if (dx > 0) { pos[i].ox += push; pos[j].ox -= push; } else { pos[i].ox -= push; pos[j].ox += push; }
                    } else {
                        var push = overlapY / 2 + 1;
                        if (dy > 0) { pos[i].oy += push; pos[j].oy -= push; } else { pos[i].oy -= push; pos[j].oy += push; }
                    }
                }
            }
            
            var nx = pos[i].ox, ny = pos[i].oy;
            
            // Re-apply arrow avoidance
            if (ny + nodeH > cy - 45 && ny < cy + 45) {
                if (nx < 75) nx = 75;
                if (nx + nodeW > W - 75) nx = W - nodeW - 75;
            }
            
            // Central node avoidance (90x90)
            var cdx = Math.abs((nx + nodeW/2) - cx), cdy = Math.abs((ny + nodeH/2) - cy);
            if (cdx < nodeW/2 + 50 && cdy < nodeH/2 + 50) {
                var ox = (nodeW/2 + 50) - cdx, oy = (nodeH/2 + 50) - cdy;
                if (ox < oy) { nx += (nx + nodeW/2 > cx ? ox : -ox); } else { ny += (ny + nodeH/2 > cy ? oy : -oy); }
            }
            
            pos[i].ox = Math.max(4, Math.min(W - nodeW - 4, nx));
            pos[i].oy = Math.max(4, Math.min(H - nodeH - 4, ny));
            pos[i].x = pos[i].ox;
            pos[i].y = pos[i].oy;
        }
    }

    // SVG — build placeholder paths (d will be overwritten every rAF frame)
    var svg = '<svg class="lines" viewBox="0 0 ' + W + ' ' + H + '">';
    for (var i = 0; i < pos.length; i++) {
        var opacity = (0.28 + Math.random() * 0.42).toFixed(2);
        svg += '<path opacity="' + opacity + '" />';
    }
    svg += '</svg>';

    // Branch nodes — each unique animation
    var html = svg;
    html += '<div class="node-center" onclick="showRootDetail()" title="Bấm để xem giải nghĩa gốc Hán">' + currentRoot.root + '</div>';
    pos.forEach(function(p, i) {
        var w = words[i];
        var dly = (Math.random() * 1.5).toFixed(2);
        html += '<div class="branch-node" data-idx="' + i + '" style="left:' + p.x + 'px;top:' + p.y + 'px;background:' + p.color + ';animation-delay:' + dly + 's;" onclick="showDetail(' + i + ')">' +
            '<div class="br-word">' + w.w.replace(currentRoot.root, '<span class="br-hl">' + currentRoot.root + '</span>') + '</div>' +
            '<div class="br-mean">' + w.m + '</div>' +
            '</div>';
    });

    canvas.innerHTML = html;

    // ── Live-update connector lines each animation frame ──
    if (window._mmLineRaf) { cancelAnimationFrame(window._mmLineRaf); window._mmLineRaf = null; }
    var svgPaths = canvas.querySelectorAll('svg.lines path');
    var nodeEls  = canvas.querySelectorAll('.branch-node');

    function animateLines() {
        var cRect = canvas.getBoundingClientRect();
        nodeEls.forEach(function(el, idx) {
            if (!svgPaths[idx]) return;
            var r = el.getBoundingClientRect();
            var bx = (r.left - cRect.left + r.width  / 2);
            var by = (r.top  - cRect.top  + r.height / 2);
            var dx = bx - cx, dy = by - cy;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 1) return;
            var mx = (cx + bx) / 2, my = (cy + by) / 2;
            var bulge = Math.min(dist * 0.28, 65);
            var cpx = (mx - (dy / dist) * bulge).toFixed(1);
            var cpy = (my + (dx / dist) * bulge).toFixed(1);
            svgPaths[idx].setAttribute('d',
                'M' + cx.toFixed(1) + ',' + cy.toFixed(1) +
                ' Q' + cpx + ',' + cpy +
                ' ' + bx.toFixed(1) + ',' + by.toFixed(1));
        });
        window._mmLineRaf = requestAnimationFrame(animateLines);
    }
    window._mmLineRaf = requestAnimationFrame(animateLines);

    // ── Mouse repulsion (flee) effect — desktop/pointer only ──
    var fleeRadius = 50;    // px — distance at which nodes start fleeing
    var fleeStrength = 45;  // px — max displacement (gentle nudge)
    var returnDelay = 200;  // ms before node starts drifting back
    var returnTimers = {};

    // Skip on touch-primary devices so tap-to-click still works
    var isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    if (!isTouchDevice) {
        canvas.addEventListener('mousemove', function(e) {
            var rect = canvas.getBoundingClientRect();
            var mx = e.clientX - rect.left;
            var my = e.clientY - rect.top;

            nodeEls.forEach(function(el, idx) {
                var ox = pos[idx].ox + nodeW / 2;
                var oy = pos[idx].oy + nodeH / 2;
                var dx = ox - mx, dy = oy - my;
                var dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < fleeRadius && dist > 0) {
                    if (returnTimers[idx]) { clearTimeout(returnTimers[idx]); returnTimers[idx] = null; }
                    var force = (1 - dist / fleeRadius);
                    var pushX = (dx / dist) * fleeStrength * force;
                    var pushY = (dy / dist) * fleeStrength * force;
                    var nx = pos[idx].ox + pushX;
                    var ny = pos[idx].oy + pushY;
                    
                    if (ny + nodeH > cy - 45 && ny < cy + 45) {
                        if (nx < 75) nx = 75;
                        if (nx + nodeW > W - 75) nx = W - nodeW - 75;
                    }
                    
                    nx = Math.max(4, Math.min(W - nodeW - 4, nx));
                    ny = Math.max(4, Math.min(H - nodeH - 4, ny));
                    
                    el.classList.remove('returning');
                    el.classList.add('fleeing');
                    el.style.left = nx + 'px';
                    el.style.top  = ny + 'px';
                } else if (el.classList.contains('fleeing') && !returnTimers[idx]) {
                    returnTimers[idx] = setTimeout(function(i, node) {
                        node.classList.remove('fleeing');
                        node.classList.add('returning');
                        node.style.left = pos[i].ox + 'px';
                        node.style.top  = pos[i].oy + 'px';
                        setTimeout(function() { node.classList.remove('returning'); }, 850);
                        returnTimers[i] = null;
                    }.bind(null, idx, el), returnDelay);
                }
            });
        });

        canvas.addEventListener('mouseleave', function() {
            nodeEls.forEach(function(el, idx) {
                if (returnTimers[idx]) { clearTimeout(returnTimers[idx]); }
                el.classList.remove('fleeing');
                el.classList.add('returning');
                el.style.left = pos[idx].ox + 'px';
                el.style.top  = pos[idx].oy + 'px';
                setTimeout(function() { el.classList.remove('returning'); }, 850);
                returnTimers[idx] = null;
            });
        });
    } // end if (!isTouchDevice)
}

function showDetail(idx) {
    window._activeWordIdx = idx;
    var w = currentRoot.words[idx];
    var exHtml = '';
    if (w.ex) {
        exHtml = '<strong>Ví dụ:</strong><br><span style="line-height: 1.5;">' + w.ex + '</span>';
        if (w.ex_vi) {
            exHtml += '<br><span style="color:var(--primary);font-size:0.9em;display:block;margin-top:6px;line-height:1.4;">' + w.ex_vi + '</span>';
        } else {
            exHtml += '<br><span id="wdExViLoading" style="color:var(--sub);font-size:0.85em;font-style:italic;display:block;margin-top:6px;">Đang dịch...</span>';
        }
    }

    document.getElementById('wdPopup').innerHTML =
        '<button class="wd-close" onclick="closeDetail()">&times;</button>' +
        '<h3>' + w.w + '</h3>' +
        '<div class="wd-mean">' + w.m + '</div>' +
        '<span class="wd-root">Gốc: ' + currentRoot.root + '</span>' +
        (exHtml ? '<div class="wd-ex">' + exHtml + '</div>' : '');
    document.getElementById('wdPopup').classList.add('show');
    document.getElementById('wdOverlay').classList.add('show');
}

function closeDetail() {
    document.getElementById('wdPopup').classList.remove('show');
    document.getElementById('wdOverlay').classList.remove('show');
}

function showRootDetail() {
    if (!currentRoot) return;
    var detail = currentRoot.detail || rootDetails[currentRoot.root] || ('Gốc Hán "' + currentRoot.root + '" mang nghĩa "' + currentRoot.meaning + '".');
    document.getElementById('wdPopup').innerHTML =
        '<button class="wd-close" onclick="closeDetail()">&times;</button>' +
        '<h3>' + currentRoot.root + ' <small style="color:var(--sub);font-size:0.7em;">(' + currentRoot.meaning + ')</small></h3>' +
        '<div style="color:var(--text);line-height:1.7;margin-bottom:10px;">' + detail + '</div>' +
        '<div style="font-size:0.92em;color:var(--sub);">Các từ phái sinh: <strong>' + currentRoot.words.length + '</strong> từ</div>';
    document.getElementById('wdPopup').classList.add('show');
    document.getElementById('wdOverlay').classList.add('show');
}

renderGrid();
</script>
